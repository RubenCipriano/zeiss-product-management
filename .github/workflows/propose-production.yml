# Proposes a production release: deploy/scripts/ci/update-versions.sh production sets production's images to the
# versions staging runs and opens the pull request "production: api 1.4.0, ..." (a branch pushed with the workflow's
# own GITHUB_TOKEN, the pull request through the REST API). Merging it is the release decision; the Deploy workflow
# then applies it once a reviewer of the environment production approves. The same as a person running
# scripts/set-version.sh production ... and opening the pull request by hand.
#
# Needs: the variable PRODUCTION_ENABLED = "true", and Settings → Actions → General → "Allow GitHub Actions to create
# and approve pull requests" (or a secret DEPLOY_PUSH_TOKEN with contents and pull requests write). A pull request
# opened with GITHUB_TOKEN starts no workflow: push a commit to it, or close and reopen it, to run Deploy's validation.
name: Propose production

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read

defaults:
  run:
    shell: bash
    working-directory: deploy

jobs:
  propose-production:
    if: vars.PRODUCTION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container: alpine/k8s:1.34.11
    steps:
      - uses: actions/checkout@v5
      - run: scripts/ci/update-versions.sh production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PUSH_TOKEN: ${{ secrets.DEPLOY_PUSH_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
