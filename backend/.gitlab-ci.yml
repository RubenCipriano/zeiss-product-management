# CI pipeline of the backend repository (the API) for GitLab. It tests, builds and scans the API image, migrates the
# environments' databases with it and releases it. It never applies Kubernetes manifests: an environment is what the
# deploy repository (gitlab.com/zeiss/deploy) holds in environments/<environment>/kustomization.yaml, and the deploy
# repository's own pipeline applies it (GitOps). Releasing means committing the new image tag there.
#
#   test ─────► build ───────► scan ──────► staging ────────────────────► production (manual)
#   format,     api image,     Trivy        migrate:staging                migrate:production
#   build,      migrations     (fails on    release:staging: commits       release:production: opens a merge
#   every test  SQL (review)   critical)    "backend: api <sha>" to the    request in deploy; merging it is the
#   suite                                   deploy repository's main       release, its pipeline then applies it
#
# Merge request pipelines run test, build and scan. Pipelines on the default branch also migrate and release to
# staging (automatically) and offer production (manual), each only once that environment is switched on
# (STAGING_ENABLED, PRODUCTION_ENABLED below); until then they stop after scan. Tag pipelines build and scan.
#
# Project- or group-level CI/CD variables (not scoped to an environment: rules cannot see environment-scoped ones):
#   STAGING_ENABLED       "true" creates the staging jobs (migrate, release) on the default branch
#   PRODUCTION_ENABLED    "true" creates the production jobs (manual); needs STAGING_ENABLED too
#   DEPLOY_REPO_TOKEN     masked, protected: a project access token of zeiss/deploy with the role Maintainer and the
#                         scope write_repository; the release jobs push the new tag with it (ci/release.sh)
# A group deploy token named exactly `gitlab-deploy-token` with the scope read_registry (zeiss group → Settings →
# Repository → Deploy tokens): GitLab passes it to every job of the group's projects as CI_DEPLOY_USER /
# CI_DEPLOY_PASSWORD; the migrate jobs store it in the cluster as the Secret gitlab-registry, to pull the image.
#
# Environment-scoped CI/CD variables (staging, production), for the migrate jobs:
#   KUBE_CONTEXT          <agent configuration project path>:<agent name> (the GitLab agent for Kubernetes), or
#   KUBECONFIG            File: a kubeconfig whose current context is the cluster; one of the two
# No database or Redis password is a pipeline variable: they are random and live in the cluster (the deploy
# repository's create-database.sh makes the Secret database-credentials, once per environment).
#
# With Argo CD (see the deploy repository) nothing changes here: Argo CD watches the deploy repository instead of its
# pipeline doing the applying, and the migrations stay in this pipeline, before the release commit.
#
# Runners: every job runs on gitlab.com's shared runners. The migrate jobs reach the database only through the
# cluster (kubectl, with the GitLab agent or a kubeconfig), so no runner needs to be inside the private network.

workflow:
  name: "$CI_COMMIT_REF_NAME: $CI_COMMIT_TITLE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request gets the MR pipeline only, not a second branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible

stages: [test, build, scan, staging, production]

include:
  # GitLab's own analysers (results in the security widget / vulnerability report where the tier has them).
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  # The release: one image, tagged with the commit. Enable tag immutability for this repository in the Container
  # Registry settings so a tag can never be overwritten.
  API_IMAGE: $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA
  # The repository that holds the environments (ci/release.sh).
  DEPLOY_REPO_URL: https://gitlab.com/zeiss/deploy.git
  # Tool images, pinned (bump them with Renovate or by hand).
  DOTNET_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0.401        # = global.json
  KUBE_TOOLS_IMAGE: alpine/k8s:1.34.11                            # bash, kubectl 1.34, git, yq
  DOCKER_IMAGE: docker:29.8.2-cli
  DIND_IMAGE: docker:29.8.2-dind
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages

default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]

# ─── Reusable pieces ────────────────────────────────────────────────────────────────────────────────────────────────

# Docker-in-Docker for Testcontainers and image builds. The runner must allow privileged containers (gitlab.com's
# Linux runners do). TLS is off: the daemon is reachable only from this job's own network.
.dind:
  services:
    - name: $DIND_IMAGE
      alias: docker
      # gitlab.com's runners use an MTU of 1460; Docker-in-Docker defaults to 1500, which silently drops large
      # packets (TLS handshakes to api.nuget.org / registry.npmjs.org time out). Match the runner's network.
      command: ["--tls=false", "--mtu=1460"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

.nuget-cache:
  cache:
    key:
      files: [Directory.Packages.props, global.json]
      prefix: nuget
    paths: [.nuget/packages]

# The environments' jobs exist only on the default branch and once the environment is switched on: without a cluster
# the migrations would fail, and a red pipeline on main would hide the result of test, build and scan. Production also
# needs staging: it is offered only what staging already runs.
.staging:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true"

.production:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true" && $PRODUCTION_ENABLED == "true"

# ─── test ───────────────────────────────────────────────────────────────────────────────────────────────────────────

test:backend:
  stage: test
  extends: [.dind, .nuget-cache]
  image: $DOTNET_SDK_IMAGE
  needs: []
  variables:
    # The integration and acceptance tests start PostgreSQL 18 and Redis 8 with Testcontainers
    # (ProductManagement.Testing/TestInfrastructure.cs) on the dind service; their ports are on its host.
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - dotnet restore ProductManagement.sln
    - dotnet format ProductManagement.sln --verify-no-changes --no-restore
    - dotnet build ProductManagement.sln --configuration Release --no-restore
    - dotnet test --solution ProductManagement.sln --configuration Release --no-build
      --report-xunit-junit --results-directory "$CI_PROJECT_DIR/TestResults"
  artifacts:
    when: always
    reports:
      junit: TestResults/*.junit.xml
    expire_in: 30 days

# ─── build ──────────────────────────────────────────────────────────────────────────────────────────────────────────

# BuildKit through docker:dind: the same Dockerfile and `docker build` as a local build, a layer cache kept in the
# registry (fast rebuilds on fresh runners), and the privileged runner the integration tests need anyway. Kaniko is
# archived upstream; Buildah (rootless) is the alternative where privileged runners are not allowed.
build:api:
  stage: build
  extends: .dind
  image: $DOCKER_IMAGE
  needs: []
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # BuildKit shares dind's network (network=host): no second bridge, so the MTU above applies to the build too.
    - docker buildx create --use --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --driver-opt network=host
  script:
    - repository="${API_IMAGE%:*}"
    - docker buildx build --pull --push
      --cache-from "type=registry,ref=$repository:buildcache"
      --cache-to "type=registry,ref=$repository:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --tag "$API_IMAGE" ${CI_COMMIT_TAG:+--tag "$repository:$CI_COMMIT_TAG"}
      .

# The exact SQL the migrations will run, for review in the merge request before it reaches production. Idempotent:
# each migration is guarded by the history table. Review artifact only: the pipeline applies migrations with the
# API image's `migrate` command, which also runs the CREATE INDEX CONCURRENTLY statements outside a transaction (in
# this script they sit in DO blocks, where PostgreSQL does not allow them).
migrations:sql:
  stage: build
  extends: .nuget-cache
  image: $DOTNET_SDK_IMAGE
  needs: []
  script:
    - dotnet tool restore
    # `dotnet ef` builds the two projects without restoring them: a fresh clone has no obj/project.assets.json.
    - dotnet restore ProductManagement.sln
    - dotnet ef migrations script --idempotent
      --project ProductManagement.Infrastructure --startup-project ProductManagement.Api
      --output "$CI_PROJECT_DIR/migrations.sql"
  artifacts:
    name: migrations-$CI_COMMIT_SHORT_SHA
    expose_as: Database migrations SQL
    paths: [migrations.sql]
    expire_in: 90 days

# ─── scan ───────────────────────────────────────────────────────────────────────────────────────────────────────────

# Every vulnerability goes to the report; the job fails on CRITICAL ones that have a fix (upgrade the base image or
# the package, or record an accepted risk in .trivyignore with a reason and an expiry).
scan:api:
  stage: scan
  needs: [build:api]
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SCANNERS: vuln
  cache:
    key: trivy
    paths: [.trivycache]
  script:
    - trivy image --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json "$API_IMAGE"
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$API_IMAGE"
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json
    expire_in: 30 days

# ─── staging (automatic on the default branch) ──────────────────────────────────────────────────────────────────────

# Applies the migrations with the API image itself (`dotnet ProductManagement.Api.dll migrate`), as the schema owner,
# before the image is released. The database is reachable only inside the cluster, so ci/migrate.sh runs the image
# there as a one-off pod, with the migrator's password from the Secret database-credentials; the job needs only
# kubectl and the cluster. Migrations must work with the version still running (expand/contract).
.migrate:
  image: $KUBE_TOOLS_IMAGE
  interruptible: false
  script:
    - ci/migrate.sh

migrate:staging:
  extends: [.migrate, .staging]
  stage: staging
  needs: [build:api, scan:api, test:backend]
  environment:
    name: staging
    action: prepare
  resource_group: staging
  variables:
    ENVIRONMENT: staging
    # Staging is a demo of the system: an empty database gets the sample catalogue (never in production).
    SEED_SAMPLE_DATA: "true"

# Commits "backend: api <sha>" to the deploy repository's main (environments/staging/kustomization.yaml); the deploy
# repository's pipeline applies it and smoke-checks staging. Starts again from the new main if it moved meanwhile.
release:staging:
  extends: .staging
  stage: staging
  image: $KUBE_TOOLS_IMAGE
  needs: [migrate:staging]
  interruptible: false
  environment:
    name: staging
    action: prepare
  resource_group: staging
  script:
    - ci/release.sh staging product-management/api="$CI_COMMIT_SHORT_SHA"

# ─── production (manual, protected) ─────────────────────────────────────────────────────────────────────────────────

# The release decision starts here: only users allowed to deploy to the protected `production` environment can start
# it. It migrates production's database with this image; release:production then opens the merge request. Migrations
# are backward compatible, so applying one before the merge request is merged (or if it never is) is safe.
migrate:production:
  extends: .migrate
  stage: production
  needs: [build:api, release:staging]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true" && $PRODUCTION_ENABLED == "true"
      when: manual
  allow_failure: false
  environment:
    name: production
    action: prepare
  resource_group: production
  variables:
    ENVIRONMENT: production
    SEED_SAMPLE_DATA: "false"

# Pushes a branch to the deploy repository that sets production's api tag to this image, with push options that open
# the merge request "Release api <sha> to production". Merging it is the release; the deploy repository's pipeline
# then applies production. Rollback: revert that merge in the deploy repository (the schema stays: expand/contract).
release:production:
  extends: .production
  stage: production
  image: $KUBE_TOOLS_IMAGE
  needs: [migrate:production]
  interruptible: false
  environment:
    name: production
    action: prepare
  resource_group: production
  script:
    - ci/release.sh production product-management/api="$CI_COMMIT_SHORT_SHA"
