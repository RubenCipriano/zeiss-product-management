# CI pipeline of the backend repository (the API) for GitLab. It only builds and publishes: it tests, builds and scans
# the API image, and when someone tags a commit with a version it publishes that version and creates a GitLab Release.
# It never touches an environment or the deploy repository (gitlab.com/zeiss/deploy): that repository chooses which
# published version each environment runs and applies it (the "pull" model); the new API pods then migrate their
# database themselves when they start.
#
#   test ─────► build ─────────► scan ──────► publish (tag vX.Y.Z only) ──► release (tag vX.Y.Z only)
#   format,     api image        Trivy        publish:api: the image         release: a GitLab Release "vX.Y.Z" with
#   build,      :<short sha>,    (fails on    gets the tag X.Y.Z (no v,      the image reference and digest, and
#   every test  migrations SQL   critical)    SemVer), same digest           the commits since the previous version
#   suite       (review)
#
# Merge request pipelines and pipelines on the default branch: test, build, scan; every image is
# registry.gitlab.com/zeiss/backend/api:<short sha> (a build of that commit, never deployed by a version rule).
# Tag pipelines, only for tags v<MAJOR>.<MINOR>.<PATCH> or v<MAJOR>.<MINOR>.<PATCH>-rc.<N> (README.md, "How to release
# a version"): test, build (reusing the main pipeline's image of that commit when it exists), scan, then publish:api
# adds the tag <MAJOR>.<MINOR>.<PATCH>[-rc.<N>] to that same image, and release creates the GitLab Release. A version
# is therefore published only after its tests and its scan passed. The deploy repository's update:staging job (or Argo
# CD Image Updater) picks the newest X.Y.Z up for staging; production changes through a merge request there.
#
# No CI/CD variable has to be set in this project: the jobs use only what GitLab provides (CI_REGISTRY_*, the job
# token). Protect the tags v* (Settings → Repository → Protected tags, allowed to create: Maintainers) so only
# maintainers release. A version is never overwritten: publish:api refuses to move an existing X.Y.Z to another image
# (on GitLab Ultimate, protected immutable container tags can enforce the same in the registry itself).
#
# Runners: every job runs on gitlab.com's shared runners (no tags).

workflow:
  name: "$CI_COMMIT_REF_NAME: $CI_COMMIT_TITLE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request gets the MR pipeline only, not a second branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # A version tag (SemVer with a leading v, optionally a release candidate -rc.N); other tags start no pipeline.
    - if: $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$/
  auto_cancel:
    on_new_commit: interruptible

stages: [test, build, scan, publish, release]

include:
  # GitLab's own analysers (results in the security widget / vulnerability report where the tier has them).
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  # The build of this commit. A version tag adds <MAJOR>.<MINOR>.<PATCH> to the same image (publish:api), which never
  # moves an existing version to another image.
  API_IMAGE: $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA
  # Every image is built for both processor families: ordinary x86-64 servers and ARM ones (Apple silicon VMs,
  # Graviton, Raspberry Pi). A node pulls only its own platform from the image index.
  PLATFORMS: linux/amd64,linux/arm64
  # Tool images, pinned (bump them with Renovate or by hand).
  DOTNET_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0.401        # = global.json
  DOCKER_IMAGE: docker:29.8.2-cli
  DIND_IMAGE: docker:29.8.2-dind
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  CRANE_IMAGE: gcr.io/go-containerregistry/crane/debug:v0.20.3   # crane (registry tool) with a busybox shell
  RELEASE_CLI_IMAGE: registry.gitlab.com/gitlab-org/release-cli:v0.24.0   # release-cli, glab and git; for release:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages

default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]

# ─── Reusable pieces ────────────────────────────────────────────────────────────────────────────────────────────────

# Docker-in-Docker for Testcontainers and image builds. The runner must allow privileged containers (gitlab.com's
# Linux runners do). TLS is off: the daemon is reachable only from this job's own network.
.dind:
  services:
    - name: $DIND_IMAGE
      alias: docker
      # gitlab.com's runners use an MTU of 1460; Docker-in-Docker defaults to 1500, which silently drops large
      # packets (TLS handshakes to api.nuget.org / registry.npmjs.org time out). Match the runner's network.
      command: ["--tls=false", "--mtu=1460"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

.nuget-cache:
  cache:
    key:
      files: [Directory.Packages.props, global.json]
      prefix: nuget
    paths: [.nuget/packages]

# The publish and release jobs exist only in pipelines of a version tag (the same pattern as in workflow:).
.version-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$/

# ─── test ───────────────────────────────────────────────────────────────────────────────────────────────────────────

test:backend:
  stage: test
  extends: [.dind, .nuget-cache]
  image: $DOTNET_SDK_IMAGE
  needs: []
  variables:
    # The integration and acceptance tests start PostgreSQL 18 and Redis 8 with Testcontainers
    # (ProductManagement.Testing/TestInfrastructure.cs) on the dind service; their ports are on its host.
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - dotnet restore ProductManagement.sln
    - dotnet format ProductManagement.sln --verify-no-changes --no-restore
    - dotnet build ProductManagement.sln --configuration Release --no-restore
    - dotnet test --solution ProductManagement.sln --configuration Release --no-build
      --report-xunit-junit --results-directory "$CI_PROJECT_DIR/TestResults"
  artifacts:
    when: always
    reports:
      junit: TestResults/*.junit.xml
    expire_in: 30 days

# ─── build ──────────────────────────────────────────────────────────────────────────────────────────────────────────

# BuildKit through docker:dind: the same Dockerfile and `docker build` as a local build, a layer cache kept in the
# registry (fast rebuilds on fresh runners), and the privileged runner the integration tests need anyway. Kaniko is
# archived upstream; Buildah (rootless) is the alternative where privileged runners are not allowed.
# In a tag pipeline the commit was normally built already by its pipeline on main: that image is reused (the version
# is then exactly the bits that were tested on main), and it is built only if it does not exist.
build:api:
  stage: build
  extends: .dind
  image: $DOCKER_IMAGE
  needs: []
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # BuildKit shares dind's network (network=host): no second bridge, so the MTU above applies to the build too.
    - docker buildx create --use --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --driver-opt network=host
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] && docker buildx imagetools inspect "$API_IMAGE" >/dev/null 2>&1; then
        echo "$API_IMAGE exists (built by the pipeline on main): reusing it"
      else
        repository="${API_IMAGE%:*}"
        docker buildx build --pull --push --platform "$PLATFORMS" \
          --cache-from "type=registry,ref=$repository:buildcache" \
          --cache-to "type=registry,ref=$repository:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
          --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
          --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
          --tag "$API_IMAGE" .
      fi

# The exact SQL the migrations will run, for review in the merge request before it reaches production. Idempotent:
# each migration is guarded by the history table. Review artifact only: the API applies the migrations itself when it
# starts (EF Core's MigrateAsync, as the schema owner), which also runs the CREATE INDEX CONCURRENTLY statements outside
# a transaction (in this script they sit in DO blocks, where PostgreSQL does not allow them).
migrations:sql:
  stage: build
  extends: .nuget-cache
  image: $DOTNET_SDK_IMAGE
  needs: []
  script:
    - dotnet tool restore
    # `dotnet ef` builds the two projects without restoring them: a fresh clone has no obj/project.assets.json.
    - dotnet restore ProductManagement.sln
    - dotnet ef migrations script --idempotent
      --project ProductManagement.Infrastructure --startup-project ProductManagement.Api
      --output "$CI_PROJECT_DIR/migrations.sql"
  artifacts:
    name: migrations-$CI_COMMIT_SHORT_SHA
    expose_as: Database migrations SQL
    paths: [migrations.sql]
    expire_in: 90 days

# ─── scan ───────────────────────────────────────────────────────────────────────────────────────────────────────────

# Every vulnerability goes to the report; the job fails on CRITICAL ones that have a fix (upgrade the base image or
# the package, or record an accepted risk in .trivyignore with a reason and an expiry).
scan:api:
  stage: scan
  needs: [build:api]
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SCANNERS: vuln
  cache:
    key: trivy
    paths: [.trivycache]
  script:
    - trivy image --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json "$API_IMAGE"
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$API_IMAGE"
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json
    expire_in: 30 days

# ─── publish (version tags only) ────────────────────────────────────────────────────────────────────────────────────

# Publishes the version: the tag <MAJOR>.<MINOR>.<PATCH>[-rc.<N>] (the git tag without its v, SemVer as Argo CD Image
# Updater's semver strategy and the deploy repository's scripts/versions.sh expect it) on the image this pipeline
# tested and scanned. `crane tag` adds a tag in the registry, without pulling or pushing the image, so the version has
# the same digest as the commit's build. The digest goes to the release job (dotenv artifact).
publish:api:
  extends: .version-tag
  stage: publish
  needs: [test:backend, build:api, scan:api]
  image:
    name: $CRANE_IMAGE
    entrypoint: [""]
  interruptible: false
  script:
    - echo "$CI_REGISTRY_PASSWORD" | crane auth login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - version="${CI_COMMIT_TAG#v}"
    # A version is never overwritten (the free equivalent of GitLab's "immutable tags"): if X.Y.Z already exists it
    # must already be this very image (a re-run of this job); anything else stops the release.
    - |
      if existing="$(crane digest "$CI_REGISTRY_IMAGE/api:$version" 2>/dev/null)"; then
        if [ "$existing" != "$(crane digest "$API_IMAGE")" ]; then
          echo "$CI_REGISTRY_IMAGE/api:$version already exists as another image ($existing): versions are never overwritten, release a new one" >&2
          exit 1
        fi
        echo "$CI_REGISTRY_IMAGE/api:$version already points at this image: nothing to do"
      else
        crane tag "$API_IMAGE" "$version"
      fi
    - echo "API_DIGEST=$(crane digest "$CI_REGISTRY_IMAGE/api:$version")" > publish.env
    - echo "Published $CI_REGISTRY_IMAGE/api:$version ($(cut -d= -f2 publish.env))"
  artifacts:
    reports:
      dotenv: publish.env

# ─── release (version tags only) ────────────────────────────────────────────────────────────────────────────────────

# A GitLab Release named after the tag (Deploy → Releases), made by GitLab's `release:` keyword with the official
# release-cli image. Its description (ci/release-notes.sh) lists the published image with its digest and the commits
# since the previous version; GIT_DEPTH 0 and the fetched tags give the script the whole history.
release:
  extends: .version-tag
  stage: release
  needs:
    - job: publish:api
      artifacts: true
  image: $RELEASE_CLI_IMAGE
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  script:
    - git fetch --tags --force --quiet origin
    - ci/release-notes.sh "$CI_COMMIT_TAG" "$CI_REGISTRY_IMAGE/api:${CI_COMMIT_TAG#v}@$API_DIGEST" > release-notes.md
    - cat release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: release-notes.md
