# The API's production settings: only what differs from deploy/k8s/base/deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: product-management
spec:
  template:
    spec:
      # The image is in the project's private registry: the pipeline creates this Secret from the deploy token
      # (deploy/ci/deploy-environment.sh).
      imagePullSecrets:
        - name: gitlab-registry-backend
      containers:
        - name: api
          env:
            # The production database server by its private DNS name, as pm_app, encrypted (SSL Mode=Require;
            # VerifyFull once the API trusts the database's CA). The password is PGPASSWORD, from the Secret api-secrets.
            - name: ConnectionStrings__ProductManagement
              value: "Host=pm-db.example.internal;Port=5432;Database=product_management;Username=pm_app;Maximum Pool Size=10;SSL Mode=Require;GSS Encryption Mode=Disable"
            # The production Redis. The password is Redis__Password, from the Secret api-secrets. For TLS append
            # ",ssl=true,sslHost=pm-cache.example.internal".
            - name: ConnectionStrings__Redis
              value: "pm-cache.example.internal:6379"
