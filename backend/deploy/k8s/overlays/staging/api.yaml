# The API's staging settings: only what differs from deploy/k8s/base/deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: product-management
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            # The staging database server by its private DNS name, as pm_app, encrypted (SSL Mode=Require; VerifyFull
            # once the API trusts the database's CA). The password is PGPASSWORD, from the Secret api-secrets.
            - name: ConnectionStrings__ProductManagement
              value: "Host=pm-db.staging.example.internal;Port=5432;Database=product_management;Username=pm_app;Maximum Pool Size=10;SSL Mode=Require;GSS Encryption Mode=Disable"
            # The staging Redis. The password is Redis__Password, from the Secret api-secrets. For TLS append
            # ",ssl=true,sslHost=pm-cache.staging.example.internal".
            - name: ConnectionStrings__Redis
              value: "pm-cache.staging.example.internal:6379"
            # Staging shows Swagger (through a port-forward); production does not.
            - name: OpenApi__Enabled
              value: "true"
