# Staging environment. Deployed only by the CI/CD pipeline (.gitlab-ci.yml), with the image it built and scanned:
#   ENVIRONMENT=staging API_IMAGE=... MIGRATIONS=skip deploy/deploy.sh      (through deploy/ci/deploy-environment.sh)
#
# Replace the example.* names in api.yaml with the real ones. The Secret api-secrets is not here: the pipeline creates
# it from protected, masked CI/CD variables before applying this overlay (deploy/ci/create-secrets.sh).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: api.yaml
