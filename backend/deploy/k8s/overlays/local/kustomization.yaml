# Local environment: Docker Desktop's Kubernetes on this machine.
#   deploy/deploy.sh        # creates the local secrets if missing, builds the image, migrates, applies this overlay
#
# The database and Redis are the cluster's shared ones, in the namespace `infra` (the infra repository: `infra.sh up`
# and `create-database.sh`; api.yaml names them). The API's own keys come from generated/, created on this machine by
# deploy/local-secrets.sh and never committed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: api.yaml
# The API's own keys. Kustomize adds a hash of the content to its name (api-secrets-<hash>) and to the
# Deployment's references, so a new key rolls the API pods on the next deploy. The database and Redis passwords are
# separate Secrets (deploy/k8s/base/deployment.yaml).
secretGenerator:
  - name: api-secrets
    namespace: product-management
    files:
      - signing-key=generated/signing-key.pem
      - consumers.json=generated/consumers.json
