# Backend deployment: API, database migrations, PostgreSQL and Redis.
#
#   kubectl apply -f backend/deploy/kubernetes.yaml
#   kubectl -n product-management scale deployment/api --replicas=4      # scale the API on its own
#
# This file is self-contained so the backend repository can deploy independently of the frontend. The two
# deployments only share a contract: the namespace and the Service name `api-headless`, which the frontend gateway
# routes to, plus the `app.kubernetes.io/name: gateway` label allowed by the NetworkPolicies.
#
# Secrets below are local-development values. In a real cluster they come from a secret manager
# (External Secrets / Sealed Secrets / Vault), never from the repository.
---
apiVersion: v1
kind: Namespace
metadata:
  name: product-management
  labels:
    app.kubernetes.io/part-of: product-management
---
# ----------------------------------------------------------------------------------------------- configuration
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: product-management
type: Opaque
stringData:
  POSTGRES_DB: product_management
  POSTGRES_USER: product_management
  POSTGRES_PASSWORD: product_management
  # Pool size per API replica. Keep (replicas x pool) within what PostgreSQL can serve: beyond that, extra
  # connections only add contention (see docs/load-test-results.md).
  connection-string: Host=postgres.product-management.svc.cluster.local;Port=5432;Database=product_management;Username=product_management;Password=product_management;Maximum Pool Size=20
---
apiVersion: v1
kind: Secret
metadata:
  name: api-auth
  namespace: product-management
type: Opaque
stringData:
  # HMAC-SHA256 key used to sign and verify access tokens. Every replica uses the same key, so a token issued by one
  # replica is accepted by all. Generate with: openssl rand -base64 32
  Authentication__SigningKey: (development key removed from history)
---
apiVersion: v1
kind: Secret
metadata:
  name: api-consumers
  namespace: product-management
type: Opaque
stringData:
  # Registered API consumers, mounted as /app/config/consumers.json. Only PBKDF2 hashes of the secrets are stored
  # (create one with `dotnet ProductManagement.Api.dll hash-secret <secret>`). Local demo secrets:
  #   viewer/viewer, clerk/clerk, manager/manager, mcp-server/mcp-local-dev-secret, load-tester-NN/load-test
  consumers.json: |
    {
      "Authentication": {
        "Consumers": [
          {
            "ClientId": "viewer",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "viewer"
            ]
          },
          {
            "ClientId": "clerk",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "stock-clerk"
            ]
          },
          {
            "ClientId": "manager",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "manager"
            ]
          },
          {
            "ClientId": "mcp-server",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "stock-clerk"
            ]
          },
          {
            "ClientId": "load-tester-01",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "stock-clerk"
            ]
          },
          {
            "ClientId": "load-tester-02",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "stock-clerk"
            ]
          },
          {
            "ClientId": "load-tester-03",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "stock-clerk"
            ]
          },
          {
            "ClientId": "load-tester-04",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "stock-clerk"
            ]
          },
          {
            "ClientId": "load-tester-05",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "stock-clerk"
            ]
          },
          {
            "ClientId": "load-tester-06",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "stock-clerk"
            ]
          },
          {
            "ClientId": "load-tester-07",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "stock-clerk"
            ]
          },
          {
            "ClientId": "load-tester-08",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "stock-clerk"
            ]
          },
          {
            "ClientId": "load-tester-09",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "stock-clerk"
            ]
          },
          {
            "ClientId": "load-tester-10",
            "SecretHash": "pbkdf2-sha256$(development hash removed from history)",
            "Roles": [
              "stock-clerk"
            ]
          }
        ]
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: product-management
data:
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Redis: redis.product-management.svc.cluster.local:6379
  Authentication__AccessTokenLifetime: "01:00:00"
  Database__ApplyMigrationsOnStartup: "false"
  OpenApi__Enabled: "true"
  RateLimiting__RequestsPerSecond: "50"
  RateLimiting__RequestBurst: "100"
  RateLimiting__WritesPerSecond: "10"
  RateLimiting__WriteBurst: "20"
  RateLimiting__TokenRequestsPerMinute: "20"
---
# ------------------------------------------------------------------------------------------------- PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: product-management
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: product-management
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: product-management
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: product-management
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: database-credentials
          args: ["-c", "max_connections=300", "-c", "shared_buffers=128MB"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { cpu: "2", memory: 768Mi }
          volumeMounts:
            # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/.
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# ------------------------------------------------------------------------------------------------------ Redis
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: product-management
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: product-management
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: product-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: product-management
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: redis
          image: redis:8-alpine
          # A pure cache: no persistence. `volatile-lru` only ever evicts keys that have a TTL, so the
          # cache-generation counter (no TTL) can never be evicted.
          args: ["--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
# ----------------------------------------------------------------------------------------------- migrations
# Applies EF Core migrations (and sample data) once per deployment, before/while the API rolls out, instead of
# every replica migrating on startup. EF Core's migration lock makes concurrent runs safe anyway.
# Jobs are immutable: the deploy script deletes the previous one before applying a new image.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: product-management
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: product-management
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: product-management
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
      containers:
        - name: migrate
          image: localhost:32000/product-management/api:latest
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-auth
          env:
            - name: ConnectionStrings__ProductManagement
              valueFrom: { secretKeyRef: { name: database-credentials, key: connection-string } }
            - name: Database__SeedSampleData
              value: "true"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# ------------------------------------------------------------------------------------------------------- API
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: product-management
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Headless: DNS returns every ready API pod. The gateway re-resolves it and balances per request, so scaling the
# API (kubectl scale) needs no change on the frontend side.
apiVersion: v1
kind: Service
metadata:
  name: api-headless
  namespace: product-management
  labels:
    app.kubernetes.io/name: api
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: product-management
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: product-management
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: product-management
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      containers:
        - name: api
          image: localhost:32000/product-management/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-auth
          env:
            - name: ConnectionStrings__ProductManagement
              valueFrom: { secretKeyRef: { name: database-credentials, key: connection-string } }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            # Give the gateway and kube-proxy time to stop routing to this pod before it stops accepting requests.
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 200m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: consumers
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: consumers
          secret:
            secretName: api-consumers
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: product-management
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
---
# ----------------------------------------------------------------------------------------- network policies
# Each backing service only accepts traffic from the components that need it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: product-management
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: db-migrate } }
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: product-management
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress]
  ingress:
    # The migration Job invalidates the cache after seeding.
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: db-migrate } }
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: product-management
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Ingress]
  ingress:
    # Only the gateway reaches the API, which is why it may trust X-Forwarded-For.
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
      ports:
        - port: 8080