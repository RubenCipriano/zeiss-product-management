# The cluster's log collector (Grafana Alloy), applied by `infra.sh up logs`. Loki and Grafana are not in the
# cluster: they run as servers outside it (logs.yaml, or a hosted Loki such as Grafana Cloud), so they keep working,
# and keep the history, when the cluster itself is in trouble.
#   kubectl apply -k logs/k8s          # what infra.sh runs (then sets LOKI_URL when it is given)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: observability
resources:
  - namespace.yaml
  - alloy.yaml
# alloy-config-<hash>: editing config.alloy rolls the collector.
configMapGenerator:
  - name: alloy-config
    namespace: observability
    files:
      - config.alloy
