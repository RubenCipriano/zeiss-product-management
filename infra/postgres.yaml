# PostgreSQL 18 for every service of the platform, in the shared namespace `infra`: one server, one database per
# service (create-database.sh creates it, with its users and their passwords in the service's namespace).
#   ./infra.sh up postgres               (creates the Secret postgres-admin first, then applies this file)
#
# What is here:
#   Namespace infra                 shared by PostgreSQL, Redis and the logs
#   ConfigMap postgres-config       the server settings (postgresql.conf), sized for 4 CPUs and 3 GiB
#   Service postgres                postgres.infra.svc.cluster.local:5432, inside the cluster only
#   StatefulSet postgres            1 replica, its data on a PersistentVolumeClaim (data-postgres-0, 20 GiB)
#   PersistentVolumeClaim postgres-backups, CronJob postgres-backup   a nightly pg_dump of every database
#
# The superuser `postgres` and its password (Secret postgres-admin, random, created by infra.sh, never committed) are
# for create-database.sh and for people; services connect with their own users.
#
# Placement: on a cluster with a node labelled infra/role=database (add-node.sh), PostgreSQL prefers that node and
# tolerates its taint, which keeps everything else off it. Without such a node (Docker Desktop, a single k3s server)
# the preference is simply not met and it runs anywhere.
apiVersion: v1
kind: Namespace
metadata:
  name: infra
  labels:
    app.kubernetes.io/part-of: infra
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: infra
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: infra
data:
  # Changing a setting here: ./infra.sh up postgres, then (most settings) reload without a restart:
  #   kubectl -n infra exec statefulset/postgres -- psql -U postgres -c 'SELECT pg_reload_conf()'
  # or, for shared_buffers, max_connections and shared_preload_libraries, restart the server:
  #   kubectl -n infra rollout restart statefulset/postgres
  postgresql.conf: |
    # Sized for this server: 4 CPUs, 3 GiB of memory (the StatefulSet's limits below). On a dedicated node scale the
    # memory settings with its RAM (shared_buffers ~25 %, effective_cache_size ~65-75 %) and raise the limits.
    # Measurements behind these values (20M-row ledger, 3.4 GB database): docs/load-test-results.md and
    # docs/adr/0022-database-at-scale.md.

    listen_addresses = '*'
    # The API's pools are 10 connections per replica, 8 replicas at most (the autoscaler's ceiling): 80, plus the
    # migrations and administrators. More connections would not add throughput. Other services share this budget.
    max_connections = 200
    password_encryption = scram-sha-256

    # Memory. With 1 GiB the 20M-row ledger evicted the products working set: a cold history page took 6.3 s, warm 0.4 s.
    shared_buffers = 768MB
    effective_cache_size = 2GB
    work_mem = 8MB
    # Index builds on the ledger and vacuum index passes.
    maintenance_work_mem = 256MB

    # Storage: SSD
    random_page_cost = 1.1
    effective_io_concurrency = 200

    # Write-ahead log and checkpoints: fewer, smoother checkpoints under bulk writes. With 1GB a bulk load forced
    # checkpoints every 4 s ("checkpoints are occurring too frequently", 42 requested vs 6 timed).
    max_wal_size = 4GB
    checkpoint_timeout = 15min
    checkpoint_completion_target = 0.9
    wal_compression = on

    # Statistics and diagnostics for EXPLAIN work (create-database.sh creates the extension in each database).
    shared_preload_libraries = 'pg_stat_statements'
    pg_stat_statements.track = top
    track_io_timing = on

    # Logs (to stderr, so Alloy collects them like any pod's): slow statements, lock waits, checkpoints and long
    # autovacuum runs.
    log_min_duration_statement = 250ms
    log_lock_waits = on
    log_checkpoints = on
    log_autovacuum_min_duration = 1s
    log_line_prefix = '%m [%p] %q%u@%d '

    # Autovacuum: per-table thresholds for the hot tables are set by a migration (products: after ~1k changed rows;
    # stock_movements: every 100k inserts), so the visibility map stays current and index-only scans stay index-only.
    autovacuum_naptime = 30s

    # Clients outside the cluster or across untrusted networks: ssl = on with a certificate from a Secret, and
    # SSL Mode=VerifyFull in their connection strings.
---
# A stable address for the server: postgres.infra.svc.cluster.local:5432. Not exposed outside the cluster; for a
# session from a laptop: kubectl -n infra port-forward svc/postgres 5432:5432
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: infra
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: infra
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# A StatefulSet, not a Deployment: its volume follows the one pod, and a new pod never starts before the old one is
# gone (two servers on one data directory would corrupt it). One replica: high availability (a standby, failover,
# continuous backups) is an operator's job, e.g. CloudNativePG (docs/adr/0006-postgresql.md).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: infra
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: infra
spec:
  serviceName: postgres
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: postgres
        app.kubernetes.io/part-of: infra
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: infra/role, operator: In, values: [database] }
      tolerations:
        - { key: infra/role, operator: Equal, value: database, effect: NoSchedule }
      containers:
        - name: postgres
          image: postgres:18-alpine
          # The image starts as root only to prepare the data directory, then runs the server as `postgres`.
          args: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-admin, key: password } }
          ports:
            - name: postgres
              containerPort: 5432
          # pg_isready over the local socket: is the server accepting connections? Startup may include crash
          # recovery, which takes as long as it takes: up to 30 minutes before the kubelet gives up.
          startupProbe:
            exec: { command: [pg_isready, -U, postgres] }
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            # Kubernetes stops containers with SIGTERM, which PostgreSQL treats as a "smart" shutdown: it would wait
            # for every client (the API's pools) to disconnect. A fast shutdown ends the sessions and checkpoints.
            preStop:
              exec: { command: [sh, -c, 'gosu postgres pg_ctl stop -D "$PGDATA" -m fast -w -t 50'] }
          # Sized together with postgresql.conf (shared_buffers, work_mem).
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "4", memory: 3Gi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: config, mountPath: /etc/postgresql, readOnly: true }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: config
          configMap:
            name: postgres-config
        # Shared memory for parallel queries; the container default (64 MB) is too small for them.
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
  # The data directory: one PersistentVolumeClaim, data-postgres-0, from the cluster's default storage class
  # (hostpath on Docker Desktop, local-path on k3s: a directory on the node). Kept when the StatefulSet is deleted:
  # `infra.sh down` never deletes it unless --delete-data is given.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/component: postgres
          app.kubernetes.io/part-of: infra
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
# Where the nightly dumps go. On one node next to the data, so it protects against mistakes (a dropped table, a bad
# migration), not against losing the node: production ships the dumps off the node (object storage) or uses the
# storage's volume snapshots (docs/guide/12-from-zero.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: infra
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: infra
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
# Every night: the roles (pg_dumpall --globals-only) and each database (pg_dump, custom format) into
# /backups/<date-time>/, keeping 7 days. Restore one database:
#   pg_restore -U postgres -d <database> --clean --if-exists <file>.dump
# Run one now: kubectl -n infra create job --from=cronjob/postgres-backup postgres-backup-now
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: infra
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: infra
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/component: postgres
            app.kubernetes.io/part-of: infra
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - { key: infra/role, operator: In, values: [database] }
          tolerations:
            - { key: infra/role, operator: Equal, value: database, effect: NoSchedule }
          containers:
            - name: backup
              image: postgres:18-alpine
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGUSER, value: postgres }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: postgres-admin, key: password } }
              command:
                - sh
                - -euc
                - |
                  dir="/backups/$(date -u +%Y%m%d-%H%M%S)"
                  mkdir -p "$dir.partial"
                  pg_dumpall --globals-only > "$dir.partial/globals.sql"
                  for db in $(psql -At -d postgres -c "SELECT datname FROM pg_database WHERE NOT datistemplate AND datname <> 'postgres'"); do
                    echo "dumping $db"
                    pg_dump -Fc -d "$db" -f "$dir.partial/$db.dump"
                  done
                  mv "$dir.partial" "$dir"
                  find /backups -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +
                  ls -l "$dir"
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: backups, mountPath: /backups }
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
