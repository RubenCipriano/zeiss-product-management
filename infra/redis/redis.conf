# Redis configuration for the cache server (redis.yaml mounts it; on a real server
# /etc/redis/redis.conf, or the managed service's parameter group). The password is passed on the command line from
# the secret store, never written here.

bind 0.0.0.0
port 6379
protected-mode yes

# A pure cache: nothing is persisted. Losing it costs a few database reads, never data.
save ""
appendonly no

# volatile-lru evicts only keys with a TTL (cached responses, rate-limit buckets, idempotency records), so the
# cache-generation counters, which have no TTL, survive memory pressure.
maxmemory 256mb
maxmemory-policy volatile-lru

# Commands that wipe the server are not for the application (CONFIG stays: the monitoring agent reads it).
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

# On a real server also: TLS (tls-port, tls-cert-file, tls-key-file) and ACL users instead of one shared password.
