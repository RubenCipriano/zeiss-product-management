# CI/CD pipeline of the infra repository (the shared infrastructure in the cluster's namespace `infra`: PostgreSQL,
# Redis, Loki, Grafana, Alloy) for GitLab. Every change is validated; deploying is always a manual step per
# environment, because this holds the data of every service and is changed rarely and deliberately.
#
#   validate ─────────────────────────────────────────► deploy (manual)
#   manifests (kubeconform), scripts (shellcheck),       ./infra.sh up in the environment's cluster
#   the inline Alloy configuration (alloy validate, fmt)
#
# Setup: docs/guide/12-from-zero.md.
#
# Project- or group-level CI/CD variables (not scoped to an environment: rules cannot see environment-scoped ones):
#   STAGING_ENABLED, PRODUCTION_ENABLED   "true" creates that environment's deploy job (manual) on the default
#                             branch; without them the pipeline only validates
#
# Environment-scoped CI/CD variables (Settings → CI/CD → Variables):
#   KUBE_CONTEXT              <agent configuration project path>:<agent name> (the GitLab agent for Kubernetes), or
#   KUBECONFIG                File: a kubeconfig whose current context is the cluster; one of the two
#   LOKI_URL                  optional: another Loki (e.g. Grafana Cloud's push URL); then no Loki or Grafana runs in
#                             the cluster and Alloy pushes there
#   LOKI_USERNAME, LOKI_PASSWORD   only with LOKI_URL, for a hosted Loki (masked)
# No password of PostgreSQL or Redis is a variable: infra.sh creates them, random, in the cluster.
# Runners: every job runs on gitlab.com's shared runners (no tags); the deploy job reaches the cluster with kubectl.

workflow:
  name: "$CI_COMMIT_REF_NAME: $CI_COMMIT_TITLE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [validate, deploy]

variables:
  # Tool images, pinned (bump them with Renovate or by hand).
  KUBE_TOOLS_IMAGE: alpine/k8s:1.34.11            # bash, kubectl 1.34, kubeconform, yq, jq
  SHELLCHECK_IMAGE: koalaman/shellcheck-alpine:v0.10.0
  ALLOY_IMAGE: grafana/alloy:v1.10.2              # = the image in logs.yaml
  KUBERNETES_VERSION: "1.34.0"

default:
  interruptible: true

# The deploy jobs exist only on the default branch and once the environment is switched on; they are always manual.
.staging:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true"
      when: manual

.production:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PRODUCTION_ENABLED == "true"
      when: manual

# ─── validate ───────────────────────────────────────────────────────────────────────────────────────────────────────

# Every object is valid against the Kubernetes API schemas (unknown fields are errors), including the dashboards'
# ConfigMap as infra.sh renders it; every dashboard is valid JSON. Hands the inline Alloy configuration to the next job.
validate:manifests:
  stage: validate
  image: $KUBE_TOOLS_IMAGE
  script:
    - kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" postgres.yaml redis.yaml logs.yaml
    - for f in dashboards/*.json; do jq empty "$f"; done
    - kubectl create configmap grafana-dashboards --namespace infra --from-file=dashboards/ --dry-run=client -o yaml
      | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" -
    - yq 'select(.kind == "ConfigMap" and .metadata.name == "alloy-config") | .data["config.alloy"]' logs.yaml
      > config.alloy
    - test -s config.alloy
  artifacts:
    paths: [config.alloy]
    expire_in: 1 day

# The scripts: shellcheck finds quoting mistakes, unset variables and the like.
validate:scripts:
  stage: validate
  image: $SHELLCHECK_IMAGE
  script:
    - shellcheck infra.sh create-database.sh add-node.sh

# The Alloy configuration (inline in logs.yaml): its components and arguments are valid, and it parses.
validate:alloy:
  stage: validate
  needs: [validate:manifests]
  image:
    name: $ALLOY_IMAGE
    entrypoint: [""]
  script:
    - alloy validate config.alloy
    - alloy fmt config.alloy > /dev/null

# ─── deploy (manual) ────────────────────────────────────────────────────────────────────────────────────────────────

# Selects the environment's cluster (the GitLab agent's context, or the kubeconfig's current context) and runs the
# same command as a laptop. Volumes and passwords are never touched by `up`; a new service's database is a separate,
# deliberate step (./create-database.sh, docs/guide/12-from-zero.md).
.deploy:
  stage: deploy
  image: $KUBE_TOOLS_IMAGE
  interruptible: false
  script:
    - if [ -n "${KUBE_CONTEXT:-}" ]; then kubectl config use-context "$KUBE_CONTEXT"; fi
    - kubectl config current-context
    - ./infra.sh up

deploy:staging:
  extends: [.deploy, .staging]
  environment:
    name: staging
    action: prepare
  resource_group: staging

deploy:production:
  extends: [.deploy, .production]
  environment:
    name: production
    action: prepare
  resource_group: production
