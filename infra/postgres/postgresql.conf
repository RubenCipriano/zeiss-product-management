# PostgreSQL server configuration for the database server (database.yaml mounts it; on a real server it
# is /etc/postgresql/18/main/postgresql.conf or the managed service's parameter group).
# Sized for the local server: 4 CPUs, 3 GiB of memory (database.yaml). On a dedicated machine scale the memory settings
# with its RAM (shared_buffers ~25 %, effective_cache_size ~65-75 %). Measurements behind these values (20M-row
# ledger, 3.4 GB database): docs/load-test-results.md and docs/adr/0022-*.md.

listen_addresses = '*'
# The API's pools are 10 connections per replica, 8 replicas at most (the autoscaler's ceiling): 80, plus the
# migration job and administrators. More connections would not add throughput.
max_connections = 200
password_encryption = scram-sha-256

# Memory. With 1 GiB the 20M-row ledger evicted the products working set: a cold history page took 6.3 s, warm 0.4 s.
shared_buffers = 768MB
effective_cache_size = 2GB
work_mem = 8MB
# Index builds on the ledger and vacuum index passes.
maintenance_work_mem = 256MB

# Storage: SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# Write-ahead log and checkpoints: fewer, smoother checkpoints under bulk writes. With 1GB a bulk load forced
# checkpoints every 4 s ("checkpoints are occurring too frequently", 42 requested vs 6 timed).
max_wal_size = 4GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = on

# Statistics and diagnostics for the monitoring server and for EXPLAIN work.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
track_io_timing = on

# Logs: slow statements, lock waits, checkpoints and long autovacuum runs, collected by the server agent.
log_min_duration_statement = 250ms
log_lock_waits = on
log_checkpoints = on
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %q%u@%d '

# Autovacuum: per-table thresholds for the hot tables are set by a migration (products: after ~1k changed rows;
# stock_movements: every 100k inserts), so the visibility map stays current and index-only scans stay index-only.
autovacuum_naptime = 30s

# On a real server also: ssl = on, ssl_cert_file / ssl_key_file, and clients connect with SSL Mode=VerifyFull.
