<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">Cancel</button>
  <button mat-flat-button class="danger" [mat-dialog-close]="true" cdkFocusInitial>
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
