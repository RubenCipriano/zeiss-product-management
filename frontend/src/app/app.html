<header class="sticky top-0 z-10 border-b border-slate-200 bg-white/80 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a routerLink="/products" class="flex items-center gap-2.5 font-semibold text-slate-900">
      <span class="flex size-8 items-center justify-center rounded-lg bg-brand-600 text-white">
        <app-icon name="package" class="size-[18px]" />
      </span>
      Product Management
    </a>

    @if (auth.isAuthenticated()) {
      <div class="flex items-center gap-3">
        <div class="hidden text-right sm:block">
          <p class="text-sm font-medium text-slate-900">{{ auth.userName() }}</p>
          <p class="text-xs text-slate-500">{{ auth.roles().join(', ') }}</p>
        </div>
        <button type="button" class="btn btn-secondary py-1.5" (click)="signOut()">Sign out</button>
      </div>
    }
  </div>
</header>

<main class="flex-1">
  <router-outlet />
</main>

<app-toast-outlet />
