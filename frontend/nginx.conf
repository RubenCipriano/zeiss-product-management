# Serves the built Angular app and reverse-proxies /api to the backend, so the browser sees a single
# origin (no CORS) exactly as with the dev-server proxy.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The API container, resolved through Docker's internal DNS.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed bundles never change: cache them aggressively.
  location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing: unknown paths fall back to index.html (which must not be cached).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
