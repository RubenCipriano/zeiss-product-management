# Static file server for the built Angular app (the "web" container).
# It sits behind the gateway (frontend/gateway), which handles routing, rate limiting and edge caching.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed bundles never change: cache them for a year.
  location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Any other file that does not exist is a 404, not the app: only extension-less paths are client-side routes.
  location ~ \.[a-zA-Z0-9]+$ {
    try_files $uri =404;
  }

  # Client-side routing: unknown paths serve index.html, which must always be revalidated so new releases
  # are picked up immediately.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
