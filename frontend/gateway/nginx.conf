# Main nginx configuration of the gateway: process settings and HTTP defaults. The routing (what goes where) lives in
# default.conf.template.
# njs is nginx's built-in JavaScript engine; the gateway uses it to verify access tokens (jwt.js) and to create trace
# ids (trace.js).
load_module modules/ngx_http_js_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Unprivileged image: temp paths must be writable by the nginx user.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # The JSON access log is defined in default.conf.template, next to the trace id it uses.

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  server_tokens off;

  include /etc/nginx/conf.d/*.conf;
}
