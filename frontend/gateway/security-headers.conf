# Security headers for every response from the gateway. Included in the server block and again in each location
# that sets its own headers (nginx drops inherited add_header directives in a location that declares any).
#
# Content-Security-Policy: only this origin may provide scripts, styles, fonts, images and API calls, and the page
# cannot be framed. It is what turns an injected <script> (XSS) into a no-op, which matters because the session
# token lives in sessionStorage. 'unsafe-inline' for styles only: Angular adds component styles as <style> elements;
# styles cannot run code. No third-party origins at all (the font is self-hosted).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# With TLS in front (production), also: Strict-Transport-Security "max-age=63072000; includeSubDomains".
