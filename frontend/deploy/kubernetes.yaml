# Frontend deployment: the static web app and the nginx gateway in front of the whole application.
#
#   kubectl apply -f frontend/deploy/kubernetes.yaml
#
# Self-contained so the frontend repository can deploy independently of the backend. The gateway routes to the
# backend's Service `api-headless` by DNS name only: scaling the API needs no change here.
---
apiVersion: v1
kind: Namespace
metadata:
  name: product-management
  labels:
    app.kubernetes.io/part-of: product-management
---
# -------------------------------------------------------------------------------------------------------- web
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: product-management
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: product-management
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: product-management
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: product-management
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: localhost:32000/product-management/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: product-management
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress
  namespace: product-management
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
      ports:
        - port: 8080
---
# ---------------------------------------------------------------------------------------------------- gateway
# Entry point of the application. LoadBalancer: Docker Desktop publishes it on http://localhost:8080; a cloud
# cluster provisions a load balancer. On MicroK8s (no load-balancer add-on) use:
#   kubectl -n product-management port-forward service/gateway 8080:8080    -> http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: product-management
  labels:
    app.kubernetes.io/name: gateway
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: product-management
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: product-management
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: product-management
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: localhost:32000/product-management/gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            # Per client IP, for /api only. The API applies its own per-user limits behind this.
            - name: GATEWAY_RATE_LIMIT_RPS
              value: "200"
            - name: GATEWAY_RATE_LIMIT_BURST
              value: "400"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: "1", memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          # The nginx entrypoint renders its config into /etc/nginx/conf.d at startup, so the root filesystem
          # stays writable for that; caches and temp files go to /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: product-management
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
