# Local environment: Docker Desktop's Kubernetes on this machine.
#   deploy/deploy.sh        # builds the web and gateway images, applies this overlay
#
# The gateway is a LoadBalancer Service: Docker Desktop publishes it on http://localhost:8080.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: gateway.yaml
