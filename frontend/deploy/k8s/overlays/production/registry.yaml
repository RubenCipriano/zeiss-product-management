# The images are in the project's private registry: the web app and the gateway pull them with the Secret the
# pipeline creates from the deploy token (deploy/ci/deploy-environment.sh). Local deployments use local images.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: product-management
spec:
  template:
    spec:
      imagePullSecrets:
        - name: gitlab-registry-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: product-management
spec:
  template:
    spec:
      imagePullSecrets:
        - name: gitlab-registry-frontend
