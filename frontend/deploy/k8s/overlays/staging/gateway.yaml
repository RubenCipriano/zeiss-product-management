# The gateway's staging settings: only what differs from deploy/k8s/base/gateway.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: product-management
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            # The API in the same cluster (the backend repository): its headless Service, port 8080.
            - name: API_UPSTREAM
              value: api.product-management.svc.cluster.local:8080
            - name: JWKS_URL
              value: http://api.product-management.svc.cluster.local:8080/.well-known/jwks.json
            # The log collector in the cluster (the infra repository's logs/k8s); "" drops the browser's error reports.
            - name: COLLECTOR_UPSTREAM
              value: alloy-faro.observability.svc.cluster.local:12347
            # Behind the Ingress controller: trust its pod network (k3s default: 10.42.0.0/16) for the real client
            # address (X-Forwarded-For).
            - name: GATEWAY_TRUSTED_PROXIES
              value: 10.42.0.0/16
