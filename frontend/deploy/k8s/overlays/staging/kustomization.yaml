# Staging environment. Deployed only by the CI/CD pipeline (.gitlab-ci.yml), with the images it built and scanned:
#   ENVIRONMENT=staging WEB_IMAGE=... GATEWAY_IMAGE=... deploy/deploy.sh
#
# Replace the example.* host in ingress.yaml with the real one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
patches:
  - path: gateway.yaml
  - path: registry.yaml
