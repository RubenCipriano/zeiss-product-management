# The web app and the gateway in front of the whole application, the same in every environment. What differs per
# environment (the API's address, the browser-error collector, exposure) is in deploy/k8s/overlays/<environment>.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: product-management
resources:
  - namespace.yaml
  - web.yaml
  - gateway.yaml
