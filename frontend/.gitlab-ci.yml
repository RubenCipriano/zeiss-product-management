# CI pipeline of the frontend repository (the web app and the gateway) for GitLab. It only builds and publishes: it
# tests, builds and scans the two images, and when someone tags a commit with a version it publishes that version of
# both and creates a GitLab Release. It never touches an environment or the deploy repository
# (gitlab.com/zeiss/deploy): that repository chooses which published version each environment runs and applies it (the
# "pull" model).
#
#   test ─────► build ─────────► scan ──────► publish (tag vX.Y.Z only) ──────► release (tag vX.Y.Z only)
#   lint,       web and gateway  Trivy        publish:web, publish:gateway:      release: a GitLab Release "vX.Y.Z"
#   format,     images           (fails on    each image gets the tag X.Y.Z      with both image references and
#   unit tests, :<short sha>     critical)    (no v, SemVer), same digest        digests, and the commits since the
#   build                                                                        previous version
#
# Merge request pipelines and pipelines on the default branch: test, build, scan; the images are
# registry.gitlab.com/zeiss/frontend/{web,gateway}:<short sha> (builds of that commit, never deployed by a version
# rule). Tag pipelines, only for tags v<MAJOR>.<MINOR>.<PATCH> or v<MAJOR>.<MINOR>.<PATCH>-rc.<N> (README.md, "How to
# release a version"): test, build (reusing the main pipeline's images of that commit when they exist), scan, then
# publish adds the tag <MAJOR>.<MINOR>.<PATCH>[-rc.<N>] to both images, and release creates the GitLab Release. web and
# gateway always share a version: they are one frontend release. The deploy repository's update:staging job (or Argo
# CD Image Updater) picks the newest X.Y.Z up for staging; production changes through a merge request there.
#
# The end-to-end tests (Playwright, e2e/) are not a job here: they need the whole running system (gateway, API, Redis,
# PostgreSQL). Run them against an environment: BASE_URL=https://<environment host> npm run e2e (README.md).
#
# No CI/CD variable has to be set in this project: the jobs use only what GitLab provides (CI_REGISTRY_*, the job
# token). Protect the tags v* (Settings → Repository → Protected tags, allowed to create: Maintainers) so only
# maintainers release. A version is never overwritten: publish:* refuses to move an existing X.Y.Z to another image
# (on GitLab Ultimate, protected immutable container tags can enforce the same in the registry itself).
#
# Runners: no job has tags, so they all run on gitlab.com's shared runners.

workflow:
  name: "$CI_COMMIT_REF_NAME: $CI_COMMIT_TITLE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request gets the MR pipeline only, not a second branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # A version tag (SemVer with a leading v, optionally a release candidate -rc.N); other tags start no pipeline.
    - if: $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$/
  auto_cancel:
    on_new_commit: interruptible

stages: [test, build, scan, publish, release]

include:
  # GitLab's own analysers (results in the security widget / vulnerability report where the tier has them).
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  # The builds of this commit. A version tag adds <MAJOR>.<MINOR>.<PATCH> to the same images (publish:*), which never
  # move an existing version to another image.
  WEB_IMAGE: $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA
  GATEWAY_IMAGE: $CI_REGISTRY_IMAGE/gateway:$CI_COMMIT_SHORT_SHA
  # Tool images, pinned (bump them with Renovate or by hand).
  NODE_IMAGE: node:24.20.0-bookworm-slim                          # = .nvmrc (24)
  DOCKER_IMAGE: docker:29.8.2-cli
  DIND_IMAGE: docker:29.8.2-dind
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  CRANE_IMAGE: gcr.io/go-containerregistry/crane/debug:v0.20.3   # crane (registry tool) with a busybox shell
  RELEASE_CLI_IMAGE: registry.gitlab.com/gitlab-org/release-cli:v0.24.0   # release-cli, glab and git; for release:
  npm_config_cache: $CI_PROJECT_DIR/.npm

default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]

# ─── Reusable pieces ────────────────────────────────────────────────────────────────────────────────────────────────

.npm-cache:
  cache:
    key:
      files: [package-lock.json]
      prefix: npm
    paths: [.npm]

# The publish and release jobs exist only in pipelines of a version tag (the same pattern as in workflow:).
.version-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$/

# ─── test ───────────────────────────────────────────────────────────────────────────────────────────────────────────

test:frontend:
  stage: test
  extends: .npm-cache
  image: $NODE_IMAGE
  needs: []
  script:
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run format:check
    - npm run test:ci -- --reporters=junit --reporters=default --output-file=reports/junit.xml
    - npm run build
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml
    expire_in: 30 days

# ─── build ──────────────────────────────────────────────────────────────────────────────────────────────────────────

# BuildKit through docker:dind: the same Dockerfiles and `docker build` as a local build, with a layer cache kept in
# the registry (fast rebuilds on fresh runners). The runner must allow privileged containers (gitlab.com's Linux
# runners do). APP_VERSION is the release the web app reports with its browser errors (the gateway ignores it): the
# commit. In a tag pipeline the commit was normally built already by its pipeline on main: that image is reused (the
# version is then exactly the bits that were tested on main), and it is built only if it does not exist.
.build-image:
  stage: build
  image: $DOCKER_IMAGE
  needs: []
  services:
    - name: $DIND_IMAGE
      alias: docker
      # gitlab.com's runners use an MTU of 1460; Docker-in-Docker defaults to 1500, which silently drops large
      # packets (TLS handshakes to api.nuget.org / registry.npmjs.org time out). Match the runner's network.
      command: ["--tls=false", "--mtu=1460"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # BuildKit shares dind's network (network=host): no second bridge, so the MTU above applies to the build too.
    - docker buildx create --use --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --driver-opt network=host
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] && docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
        echo "$IMAGE exists (built by the pipeline on main): reusing it"
      else
        repository="${IMAGE%:*}"
        docker buildx build --pull --push \
          --cache-from "type=registry,ref=$repository:buildcache" \
          --cache-to "type=registry,ref=$repository:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
          --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
          --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
          --build-arg "APP_VERSION=$CI_COMMIT_SHORT_SHA" \
          --tag "$IMAGE" "$CONTEXT"
      fi

build:web:
  extends: .build-image
  variables:
    IMAGE: $WEB_IMAGE
    CONTEXT: .

build:gateway:
  extends: .build-image
  variables:
    IMAGE: $GATEWAY_IMAGE
    CONTEXT: gateway

# ─── scan ───────────────────────────────────────────────────────────────────────────────────────────────────────────

# Every vulnerability goes to the report; the job fails on CRITICAL ones that have a fix (upgrade the base image or
# the package, or record an accepted risk in .trivyignore with a reason and an expiry).
.scan-image:
  stage: scan
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SCANNERS: vuln
  cache:
    key: trivy
    paths: [.trivycache]
  script:
    - trivy image --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json "$IMAGE"
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE"
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json
    expire_in: 30 days

scan:web:
  extends: .scan-image
  needs: [build:web]
  variables:
    IMAGE: $WEB_IMAGE

scan:gateway:
  extends: .scan-image
  needs: [build:gateway]
  variables:
    IMAGE: $GATEWAY_IMAGE

# ─── publish (version tags only) ────────────────────────────────────────────────────────────────────────────────────

# Publishes the version: the tag <MAJOR>.<MINOR>.<PATCH>[-rc.<N>] (the git tag without its v, SemVer as Argo CD Image
# Updater's semver strategy and the deploy repository's scripts/versions.sh expect it) on the image this pipeline
# tested and scanned. `crane tag` adds a tag in the registry, without pulling or pushing the image, so the version has
# the same digest as the commit's build. The digest goes to the release job (dotenv artifact). Both jobs need every
# test and scan, so a version is published for both images or for none.
.publish-image:
  extends: .version-tag
  stage: publish
  needs: [test:frontend, build:web, build:gateway, scan:web, scan:gateway]
  image:
    name: $CRANE_IMAGE
    entrypoint: [""]
  interruptible: false
  script:
    - echo "$CI_REGISTRY_PASSWORD" | crane auth login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - version="${CI_COMMIT_TAG#v}"
    # A version is never overwritten (the free equivalent of GitLab's "immutable tags"): if X.Y.Z already exists it
    # must already be this very image (a re-run of this job); anything else stops the release.
    - |
      if existing="$(crane digest "${IMAGE%:*}:$version" 2>/dev/null)"; then
        if [ "$existing" != "$(crane digest "$IMAGE")" ]; then
          echo "${IMAGE%:*}:$version already exists as another image ($existing): versions are never overwritten, release a new one" >&2
          exit 1
        fi
        echo "${IMAGE%:*}:$version already points at this image: nothing to do"
      else
        crane tag "$IMAGE" "$version"
      fi
    - echo "${DIGEST_VARIABLE}=$(crane digest "${IMAGE%:*}:$version")" > publish.env
    - echo "Published ${IMAGE%:*}:$version ($(cut -d= -f2 publish.env))"
  artifacts:
    reports:
      dotenv: publish.env

publish:web:
  extends: .publish-image
  variables:
    IMAGE: $WEB_IMAGE
    DIGEST_VARIABLE: WEB_DIGEST

publish:gateway:
  extends: .publish-image
  variables:
    IMAGE: $GATEWAY_IMAGE
    DIGEST_VARIABLE: GATEWAY_DIGEST

# ─── release (version tags only) ────────────────────────────────────────────────────────────────────────────────────

# A GitLab Release named after the tag (Deploy → Releases), made by GitLab's `release:` keyword with the official
# release-cli image. Its description (ci/release-notes.sh) lists the two published images with their digests and the
# commits since the previous version; GIT_DEPTH 0 and the fetched tags give the script the whole history.
release:
  extends: .version-tag
  stage: release
  needs:
    - job: publish:web
      artifacts: true
    - job: publish:gateway
      artifacts: true
  image: $RELEASE_CLI_IMAGE
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  script:
    - git fetch --tags --force --quiet origin
    - version="${CI_COMMIT_TAG#v}"
    - ci/release-notes.sh "$CI_COMMIT_TAG"
      "$CI_REGISTRY_IMAGE/web:$version@$WEB_DIGEST" "$CI_REGISTRY_IMAGE/gateway:$version@$GATEWAY_DIGEST"
      > release-notes.md
    - cat release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: release-notes.md
