# CI pipeline of the frontend repository (the web app and the gateway) for GitLab. It tests, builds and scans the two
# images and releases them. It never applies Kubernetes manifests: an environment is what the deploy repository
# (gitlab.com/zeiss/deploy) holds in environments/<environment>/kustomization.yaml, and the deploy repository's own
# pipeline applies it (GitOps). Releasing means committing the new image tags there.
#
#   test ─────► build ─────► scan ──────► staging ─────────────────────────► production (manual)
#   lint,       web and      Trivy        release:staging: commits           release:production: opens a merge
#   format,     gateway      (fails on    "frontend: web, gateway <sha>"     request in deploy; merging it is the
#   unit tests, images       critical)    to the deploy repository's main    release, its pipeline then applies it
#   build
#
# Merge request pipelines run test, build and scan. Pipelines on the default branch also release to staging
# (automatically) and offer production (manual), each only once that environment is switched on (STAGING_ENABLED,
# PRODUCTION_ENABLED below); until then they stop after scan. Tag pipelines build and scan.
#
# The end-to-end tests (Playwright, e2e/) are not a job here: they need the whole running system (gateway, API, Redis,
# PostgreSQL). Run them against an environment: BASE_URL=https://<environment host> npm run e2e (README.md).
#
# Project- or group-level CI/CD variables:
#   STAGING_ENABLED       "true" creates release:staging on the default branch
#   PRODUCTION_ENABLED    "true" creates release:production (manual); needs STAGING_ENABLED too
#   DEPLOY_REPO_TOKEN     masked, protected: a project access token of zeiss/deploy with the role Maintainer and the
#                         scope write_repository; the release jobs push the new tags with it (ci/release.sh)
# The cluster pulls the images with the zeiss group's deploy token (gitlab-deploy-token, read_registry), which the
# deploy repository's pipeline stores in the cluster: nothing to set here for that.
#
# With Argo CD (see the deploy repository) nothing changes here: Argo CD watches the deploy repository instead of its
# pipeline doing the applying.
#
# Runners: no job has tags, so they all run on gitlab.com's shared runners.

workflow:
  name: "$CI_COMMIT_REF_NAME: $CI_COMMIT_TITLE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request gets the MR pipeline only, not a second branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible

stages: [test, build, scan, staging, production]

include:
  # GitLab's own analysers (results in the security widget / vulnerability report where the tier has them).
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  # The release: two images, tagged with the commit. Enable tag immutability for this repository in the Container
  # Registry settings so a tag can never be overwritten.
  WEB_IMAGE: $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA
  GATEWAY_IMAGE: $CI_REGISTRY_IMAGE/gateway:$CI_COMMIT_SHORT_SHA
  # The repository that holds the environments (ci/release.sh).
  DEPLOY_REPO_URL: https://gitlab.com/zeiss/deploy.git
  # Tool images, pinned (bump them with Renovate or by hand).
  NODE_IMAGE: node:24.20.0-bookworm-slim                          # = .nvmrc (24)
  KUBE_TOOLS_IMAGE: alpine/k8s:1.34.11                            # bash, git, yq
  DOCKER_IMAGE: docker:29.8.2-cli
  DIND_IMAGE: docker:29.8.2-dind
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  npm_config_cache: $CI_PROJECT_DIR/.npm

default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]

# ─── Reusable pieces ────────────────────────────────────────────────────────────────────────────────────────────────

.npm-cache:
  cache:
    key:
      files: [package-lock.json]
      prefix: npm
    paths: [.npm]

# The release jobs exist only on the default branch and once the environment is switched on. Production also needs
# staging: it is offered only what staging already runs.
.staging:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true"

# ─── test ───────────────────────────────────────────────────────────────────────────────────────────────────────────

test:frontend:
  stage: test
  extends: .npm-cache
  image: $NODE_IMAGE
  needs: []
  script:
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run format:check
    - npm run test:ci -- --reporters=junit --reporters=default --output-file=reports/junit.xml
    - npm run build
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml
    expire_in: 30 days

# ─── build ──────────────────────────────────────────────────────────────────────────────────────────────────────────

# BuildKit through docker:dind: the same Dockerfiles and `docker build` as a local build, with a layer cache kept in
# the registry (fast rebuilds on fresh runners). The runner must allow privileged containers (gitlab.com's Linux
# runners do). APP_VERSION is the release the web app reports with its browser errors (the gateway ignores it).
.build-image:
  stage: build
  image: $DOCKER_IMAGE
  needs: []
  services:
    - name: $DIND_IMAGE
      alias: docker
      # gitlab.com's runners use an MTU of 1460; Docker-in-Docker defaults to 1500, which silently drops large
      # packets (TLS handshakes to api.nuget.org / registry.npmjs.org time out). Match the runner's network.
      command: ["--tls=false", "--mtu=1460"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # BuildKit shares dind's network (network=host): no second bridge, so the MTU above applies to the build too.
    - docker buildx create --use --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --driver-opt network=host
  script:
    - repository="${IMAGE%:*}"
    - docker buildx build --pull --push
      --cache-from "type=registry,ref=$repository:buildcache"
      --cache-to "type=registry,ref=$repository:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --build-arg "APP_VERSION=$CI_COMMIT_SHORT_SHA"
      --tag "$IMAGE" ${CI_COMMIT_TAG:+--tag "$repository:$CI_COMMIT_TAG"}
      "$CONTEXT"

build:web:
  extends: .build-image
  variables:
    IMAGE: $WEB_IMAGE
    CONTEXT: .

build:gateway:
  extends: .build-image
  variables:
    IMAGE: $GATEWAY_IMAGE
    CONTEXT: gateway

# ─── scan ───────────────────────────────────────────────────────────────────────────────────────────────────────────

# Every vulnerability goes to the report; the job fails on CRITICAL ones that have a fix (upgrade the base image or
# the package, or record an accepted risk in .trivyignore with a reason and an expiry).
.scan-image:
  stage: scan
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SCANNERS: vuln
  cache:
    key: trivy
    paths: [.trivycache]
  script:
    - trivy image --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json "$IMAGE"
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE"
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json
    expire_in: 30 days

scan:web:
  extends: .scan-image
  needs: [build:web]
  variables:
    IMAGE: $WEB_IMAGE

scan:gateway:
  extends: .scan-image
  needs: [build:gateway]
  variables:
    IMAGE: $GATEWAY_IMAGE

# ─── staging (automatic on the default branch) ──────────────────────────────────────────────────────────────────────

# Commits "frontend: web, gateway <sha>" to the deploy repository's main (environments/staging/kustomization.yaml);
# the deploy repository's pipeline applies it and smoke-checks staging. Starts again from the new main if it moved
# meanwhile (e.g. the backend released at the same moment).
release:staging:
  extends: .staging
  stage: staging
  image: $KUBE_TOOLS_IMAGE
  needs: [build:web, build:gateway, scan:web, scan:gateway, test:frontend]
  interruptible: false
  environment:
    name: staging
    action: prepare
  resource_group: staging
  script:
    - ci/release.sh staging
      product-management/web="$CI_COMMIT_SHORT_SHA" product-management/gateway="$CI_COMMIT_SHORT_SHA"

# ─── production (manual, protected) ─────────────────────────────────────────────────────────────────────────────────

# The release decision: only users allowed to deploy to the protected `production` environment can start it. Pushes a
# branch to the deploy repository that sets production's web and gateway tags to these images, with push options that
# open the merge request "Release web, gateway <sha> to production". Merging it is the release; the deploy
# repository's pipeline then applies production. Rollback: revert that merge in the deploy repository.
release:production:
  stage: production
  image: $KUBE_TOOLS_IMAGE
  needs: [release:staging]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true" && $PRODUCTION_ENABLED == "true"
      when: manual
  allow_failure: false
  interruptible: false
  environment:
    name: production
    action: prepare
  resource_group: production
  script:
    - ci/release.sh production
      product-management/web="$CI_COMMIT_SHORT_SHA" product-management/gateway="$CI_COMMIT_SHORT_SHA"
