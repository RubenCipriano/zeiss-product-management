# Argo CD Application for staging: Argo CD (inside the cluster) watches deploy/environments/staging on main of this
# repository
# and applies every commit by itself, instead of the Deploy workflow's deploy-staging job.
#
#   automated sync   a new commit on main is applied within about 3 minutes (Argo CD's polling interval), or at once
#                    with a GitHub webhook to Argo CD
#   prune            an object removed from git is removed from the cluster
#   selfHeal         a change made by hand in the cluster (kubectl edit) is put back to what git says
#
# The annotations are for Argo CD Image Updater (the ImageUpdater in image-updater.yaml reads them): it does what the
# workflow update-staging does today. It checks the registry for new versions of the three images, takes the newest
# X.Y.Z (SemVer; pre-releases -rc.N are left out by allow-tags), and writes it into
# deploy/environments/staging/kustomization.yaml (`images:` newTag) as a git commit on main (write-back-method git),
# pushed over SSH with the deploy key in the Secret argocd/deploy-write-key. Argo CD then syncs that commit. So
# staging's history stays in git.
#
# The repository is reached over SSH (repoURL git@github.com:...): Argo CD reads it with a read-only deploy key (the
# repository Secret repo-zeiss-deploy), Image Updater pushes with a second deploy key that has write access (GitHub:
# Settings → Deploy keys → "Allow write access"; README.md, "Moving to Argo CD", steps 3 and 4).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-management-staging
  namespace: argocd
  labels:
    # image-updater.yaml selects the Applications to update by this label.
    image-updater: product-management
  annotations:
    # The images to watch, as <alias>=<repository>; the alias names them in the annotations below.
    argocd-image-updater.argoproj.io/image-list: api=ghcr.io/rubencipriano/zeiss-product-management/api,web=ghcr.io/rubencipriano/zeiss-product-management/web,gateway=ghcr.io/rubencipriano/zeiss-product-management/gateway
    # Newest SemVer version; only plain releases X.Y.Z.
    argocd-image-updater.argoproj.io/api.update-strategy: semver
    argocd-image-updater.argoproj.io/api.allow-tags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/web.update-strategy: semver
    argocd-image-updater.argoproj.io/web.allow-tags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/gateway.update-strategy: semver
    argocd-image-updater.argoproj.io/gateway.allow-tags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
    # The names in environments/staging/kustomization.yaml (images[].name) that the new versions are written to.
    argocd-image-updater.argoproj.io/api.kustomize.image-name: product-management/api
    argocd-image-updater.argoproj.io/web.kustomize.image-name: product-management/web
    argocd-image-updater.argoproj.io/gateway.kustomize.image-name: product-management/gateway
    # The registry may be private: a token with read:packages, as a docker-registry Secret in argocd.
    argocd-image-updater.argoproj.io/api.pull-secret: pullsecret:argocd/registry-credentials
    argocd-image-updater.argoproj.io/web.pull-secret: pullsecret:argocd/registry-credentials
    argocd-image-updater.argoproj.io/gateway.pull-secret: pullsecret:argocd/registry-credentials
    # Write the new versions to git (not only into Argo CD's state): a commit on main to the kustomization.yaml of the
    # Application's path, pushed to spec.source.repoURL over SSH with the Secret argocd/deploy-write-key (key
    # sshPrivateKey: the private half of a deploy key of this repository with "Allow write access", allowed to push to
    # the protected main). The Secret must be in the ImageUpdater's namespace (argocd).
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/deploy-write-key
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    # SSH, so Image Updater's write-back can push with a deploy key (repository Secret: README.md, "Moving to Argo CD").
    repoURL: git@github.com:RubenCipriano/zeiss-product-management.git
    targetRevision: main
    path: deploy/environments/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: product-management
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
