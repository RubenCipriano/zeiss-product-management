# Argo CD Application for staging: Argo CD (inside the cluster) watches environments/staging on main of this repository
# and applies every commit by itself, instead of the pipeline's deploy:staging job.
#
#   automated sync   a new commit on main is applied within about 3 minutes (Argo CD's polling interval), or at once
#                    with a GitLab webhook to Argo CD
#   prune            an object removed from git is removed from the cluster
#   selfHeal         a change made by hand in the cluster (kubectl edit) is put back to what git says
#
# The annotations are for Argo CD Image Updater (the ImageUpdater in image-updater.yaml reads them): it does what the
# pipeline's update:staging job does today. It checks the registry for new versions of the three images, takes the
# newest X.Y.Z (SemVer; pre-releases -rc.N are left out by allow-tags), and writes it into
# environments/staging/kustomization.yaml (`images:` newTag) as a git commit on main (write-back-method git), with the
# credentials in the Secret argocd/deploy-push-token. Argo CD then syncs that commit. So staging's history stays in git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-management-staging
  namespace: argocd
  labels:
    # image-updater.yaml selects the Applications to update by this label.
    image-updater: product-management
  annotations:
    # The images to watch, as <alias>=<repository>; the alias names them in the annotations below.
    argocd-image-updater.argoproj.io/image-list: api=registry.gitlab.com/zeiss/backend/api,web=registry.gitlab.com/zeiss/frontend/web,gateway=registry.gitlab.com/zeiss/frontend/gateway
    # Newest SemVer version; only plain releases X.Y.Z.
    argocd-image-updater.argoproj.io/api.update-strategy: semver
    argocd-image-updater.argoproj.io/api.allow-tags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/web.update-strategy: semver
    argocd-image-updater.argoproj.io/web.allow-tags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/gateway.update-strategy: semver
    argocd-image-updater.argoproj.io/gateway.allow-tags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
    # The names in environments/staging/kustomization.yaml (images[].name) that the new versions are written to.
    argocd-image-updater.argoproj.io/api.kustomize.image-name: product-management/api
    argocd-image-updater.argoproj.io/web.kustomize.image-name: product-management/web
    argocd-image-updater.argoproj.io/gateway.kustomize.image-name: product-management/gateway
    # The registries are private: the group deploy token (read_registry), as a docker-registry Secret in argocd.
    argocd-image-updater.argoproj.io/api.pull-secret: pullsecret:argocd/gitlab-registry
    argocd-image-updater.argoproj.io/web.pull-secret: pullsecret:argocd/gitlab-registry
    argocd-image-updater.argoproj.io/gateway.pull-secret: pullsecret:argocd/gitlab-registry
    # Write the new versions to git (not only into Argo CD's state): a commit on main to the kustomization.yaml of the
    # Application's path, with this repository's project access token (Secret argocd/deploy-push-token, keys
    # username and password), the same token the update:staging job uses.
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/deploy-push-token
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://gitlab.com/zeiss/deploy.git
    targetRevision: main
    path: environments/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: product-management
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
