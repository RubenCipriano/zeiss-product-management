# The database migration as an Argo CD PreSync hook: before Argo CD applies a sync of the environment, it runs this Job
# and waits for it; if the Job fails, the sync stops and nothing else changes (the same rule as scripts/migrate.sh in
# the pipeline: the schema first, then the new pods).
#
# The image `product-management/api` is replaced by the environment's `images:` (Kustomize), so the Job always runs the
# exact API version the sync is about to roll out, with the command `migrate`, as the schema owner from the Secret
# database-credentials, and the Redis password from redis-credentials (both made once per environment, as today).
#
#   hook-delete-policy BeforeHookCreation   the previous run's Job is deleted before a new one is created
#                      HookSucceeded        a successful Job is deleted at once; a failed one stays for its logs
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: product-management
  labels:
    app.kubernetes.io/name: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0                # a failed migration is not retried blindly: read its log, fix forward
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: product-management
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: product-management/api
          args: ["migrate"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # The sample catalogue only on an empty database; staging got it on its first deploy already.
            - name: Database__SeedSampleData
              value: "false"
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: database-credentials, key: host } }
            - name: DB_PORT
              valueFrom: { secretKeyRef: { name: database-credentials, key: port } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: database-credentials, key: database } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: database-credentials, key: migrator-user } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: database-credentials, key: migrator-password } }
            - name: ConnectionStrings__ProductManagement
              value: "Host=$(DB_HOST);Port=$(DB_PORT);Database=$(DB_NAME);Username=$(DB_USER);GSS Encryption Mode=Disable"
            # The same Redis as environments/<environment>/api.yaml (the migration invalidates its cached lists).
            - name: ConnectionStrings__Redis
              value: "redis.infra.svc.cluster.local:6379"
            - name: Redis__Password
              valueFrom: { secretKeyRef: { name: redis-credentials, key: password } }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
