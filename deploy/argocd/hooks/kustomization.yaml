# The database migration as an Argo CD PreSync hook, for when Argo CD applies the environments (README.md, "Moving to
# Argo CD"). A Kustomize Component that an environment includes:
#
#   components:
#     - ../../argocd/hooks
#
# NOT included by any environment today: the pipeline (scripts/deploy.sh → scripts/migrate.sh) migrates before it
# applies. Including it while the pipeline applies would only create a Job that nothing runs as a hook (kubectl apply
# ignores the hook annotations), so it is added in the same change that switches to Argo CD.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - migrate.yaml
