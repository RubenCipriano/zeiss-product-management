# Local environment: Docker Desktop's Kubernetes on this machine.
#   scripts/deploy.sh local        # local secrets (first run), images from ../backend and ../frontend, migrations, apply
#
# The database and Redis are the cluster's shared ones, in the namespace `infra` (scripts/infra.sh up and
# scripts/create-database.sh; api.yaml names them). The gateway is a LoadBalancer Service: Docker Desktop publishes it
# on http://localhost:8080.
#
# generated/ is made on this machine and never committed:
#   signing-key.pem, consumers.json   the API's own keys (scripts/local-secrets.sh)
#   build/kustomization.yaml          the images scripts/deploy.sh built (their tags) and, with LOGS=off, the gateway
#                                     without a log collector
# so `kubectl diff -k environments/local` compares the cluster with exactly what the last deploy applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Also on what the environment adds (its Secret generator); apps/ labels the rest.
labels:
  - pairs:
      app.kubernetes.io/part-of: product-management
resources:
  - ../../apps/backend
  - ../../apps/frontend
patches:
  - path: api.yaml
  - path: gateway.yaml
components:
  - generated/build
# The API's own keys. Kustomize adds a hash of the content to its name (api-secrets-<hash>) and to the
# Deployment's references, so a new key rolls the API pods on the next deploy. The database and Redis passwords are
# separate Secrets (apps/backend/deployment.yaml).
secretGenerator:
  - name: api-secrets
    namespace: product-management
    files:
      - signing-key=generated/signing-key.pem
      - consumers.json=generated/consumers.json
