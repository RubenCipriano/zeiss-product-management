# Local environment: a cluster on this machine, Docker Desktop's Kubernetes (macOS, Windows) or a single-node k3s
# (an Ubuntu server, scripts/setup-ubuntu.sh).
#   scripts/deploy.sh local                    # images built from ../backend and ../frontend (when they are there)
#   scripts/deploy.sh local --version 1.0.0    # a published version from the registry (only this repository needed)
#
# The database and Redis are the cluster's shared ones, in the namespace `infra` (scripts/infra.sh up and
# scripts/lib/create-database.sh; api.yaml names them). The gateway is a LoadBalancer Service: Docker Desktop publishes
# it on http://localhost:8080, k3s (ServiceLB) on the server's addresses, http://<server-ip>:8080.
#
# generated/ is made on this machine and never committed:
#   signing-key.pem, consumers.json   the API's own keys (scripts/lib/local-secrets.sh)
#   build/kustomization.yaml          the images of the last deploy: the tags scripts/deploy.sh built, or a published
#                                     version's registry names, tag and pull Secret (registry-credentials); with
#                                     LOGS=off, the gateway without a log collector
# so `kubectl diff -k environments/local` compares the cluster with exactly what the last deploy applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Also on what the environment adds (its Secret generator); apps/ labels the rest.
labels:
  - pairs:
      app.kubernetes.io/part-of: product-management
resources:
  - ../../apps/backend
  - ../../apps/frontend
patches:
  - path: api.yaml
  - path: gateway.yaml
components:
  - generated/build
# The API's own keys. Kustomize adds a hash of the content to its name (api-secrets-<hash>) and to the
# Deployment's references, so a new key rolls the API pods on the next deploy. The database and Redis passwords are
# separate Secrets (apps/backend/deployment.yaml).
secretGenerator:
  - name: api-secrets
    namespace: product-management
    files:
      - signing-key=generated/signing-key.pem
      - consumers.json=generated/consumers.json
