# The gateway's local settings: only what differs from apps/frontend/gateway.yaml.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: product-management
spec:
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: product-management
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            # The API in this cluster (apps/backend): its headless Service, port 8080. To use an API
            # elsewhere, put its host:port here and its public keys' URL in JWKS_URL.
            - name: API_UPSTREAM
              value: api.product-management.svc.cluster.local:8080
            - name: JWKS_URL
              value: http://api.product-management.svc.cluster.local:8080/.well-known/jwks.json
            # The browser's error reports go to the log collector of the shared infrastructure, namespace infra (the
            # scripts/infra.sh up logs). Without it, deploy with `LOGS=off scripts/deploy.sh local`: this becomes "" and the
            # gateway answers /collect with 204, dropping the reports.
            - name: COLLECTOR_UPSTREAM
              value: alloy-faro.infra.svc.cluster.local:12347
