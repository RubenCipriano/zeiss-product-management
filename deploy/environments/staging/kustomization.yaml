# Staging environment: the API, the web app and the gateway, at the newest released versions.
#
# Applied by the Deploy workflow (deploy-staging, scripts/deploy.sh staging) whenever main changes this folder or
# apps/ (the new API pods migrate the database themselves). The versions below are pulled in by this repository: the
# workflow update-staging (scripts/ci/update-versions.sh staging) sets each newTag to the newest X.Y.Z in the registry
# and commits "staging: api 1.4.0, ..." to main. One commit per change of versions, so
# `git log deploy/environments/staging` is the deployment history; a rollback is scripts/set-version.sh staging <image>
# <older version> (or a `git revert`), with STAGING_HOLD=true meanwhile so the next release does not undo it.
#
# No Secret is here: scripts/deploy.sh creates the registry credential (registry-credentials) and api-secrets from the
# environment's secrets and copies redis-credentials from the shared Redis; database-credentials is made once by
# scripts/lib/create-database.sh. Replace the example.* host in ingress.yaml with the real one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Also on what the environment adds (the Ingress); apps/ labels the rest.
labels:
  - pairs:
      app.kubernetes.io/part-of: product-management
resources:
  - ../../apps/backend
  - ../../apps/frontend
  - ingress.yaml
patches:
  - path: api.yaml
  - path: gateway.yaml
  - path: registry.yaml
# The deployed versions (SemVer X.Y.Z, published by a tag backend/vX.Y.Z or frontend/vX.Y.Z): changed with
# scripts/set-version.sh, by update-staging or by a person. "unreleased": no version chosen yet; scripts/deploy.sh
# refuses to apply until every image has one.
images:
  - name: product-management/api
    newName: ghcr.io/rubencipriano/zeiss-product-management/api
    newTag: unreleased
  - name: product-management/web
    newName: ghcr.io/rubencipriano/zeiss-product-management/web
    newTag: unreleased
  - name: product-management/gateway
    newName: ghcr.io/rubencipriano/zeiss-product-management/gateway
    newTag: unreleased
