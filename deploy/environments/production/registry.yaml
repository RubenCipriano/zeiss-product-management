# The images are in the repository's container registry (ghcr.io): the web app and the gateway pull them with the
# Secret scripts/deploy.sh creates from REGISTRY_USER and REGISTRY_PASSWORD (a token with read:packages). (Local
# deployments get it only for published images, from the component scripts/deploy.sh generates.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: product-management
spec:
  template:
    spec:
      imagePullSecrets:
        - name: registry-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: product-management
spec:
  template:
    spec:
      imagePullSecrets:
        - name: registry-credentials
