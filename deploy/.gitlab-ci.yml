# CI/CD pipeline of the deploy repository for GitLab: the only place that changes the clusters. What runs in an
# environment is what this repository holds (GitOps): environments/<environment> for the application, infra/ for the
# shared infrastructure. The backend and frontend pipelines never apply anything; they release by committing an image
# tag to environments/staging (and by opening a merge request for environments/production).
#
#   validate (every MR and commit) ──► staging (main, automatic) ───────► production (main, manual)
#   manifests (scripts/validate.sh),     deploy:staging: scripts/deploy.sh    deploy:production: scripts/deploy.sh
#   scripts (shellcheck),                staging apps                         production apps
#   Alloy configuration                  smoke:staging: scripts/smoke.sh      smoke:production
#                                        infra:staging (manual)               infra:production (manual)
#
# deploy:staging runs on the default branch when a commit changes environments/staging, apps/, infra/ or the deploy
# script; deploy:production when it changes environments/production (a merged release merge request) or apps/, and
# waits for a person to start it. Rollback: `git revert` the release commit (or merge) on main; the pipeline applies
# the previous tags. infra/ is applied only by the manual infra jobs: it holds the data of every service.
#
# Project- or group-level CI/CD variables (not scoped to an environment: rules cannot see environment-scoped ones):
#   STAGING_ENABLED, PRODUCTION_ENABLED   "true" creates that environment's jobs on the default branch; without them
#                                         the pipeline only validates
# A group deploy token named exactly `gitlab-deploy-token` with the scope read_registry on the zeiss group (group →
# Settings → Repository → Deploy tokens): it reads both registries (backend and frontend), and GitLab passes it to the
# jobs as CI_DEPLOY_USER / CI_DEPLOY_PASSWORD; scripts/deploy.sh stores it as the Secret gitlab-registry.
#
# Environment-scoped CI/CD variables (staging, production):
#   KUBE_CONTEXT                    <agent configuration project path>:<agent name> (the GitLab agent), or
#   KUBECONFIG                      File: a kubeconfig whose current context is the cluster; one of the two
#   API_SIGNING_KEY                 File, protected: the API's ES256 private key (PEM)          → Secret api-secrets
#   API_CONSUMERS                   File, protected: consumers.json                             → Secret api-secrets
#   SMOKE_CLIENT_ID, SMOKE_CLIENT_SECRET   optional (secret masked): a viewer consumer, for the signed-in smoke check
#   LOKI_URL, LOKI_USERNAME, LOKI_PASSWORD optional, infra jobs: another Loki (scripts/infra.sh)
# STAGING_URL and PRODUCTION_URL (below) are the environments' public hosts (environments/*/ingress.yaml).
#
# Argo CD instead of these jobs: one Argo CD Application per environment, pointing at environments/<environment> of
# this repository (automated sync for staging, manual for production; README.md). Then the deploy and smoke jobs below
# are removed and this pipeline keeps only validate; Argo CD applies main and shows the drift. The Secrets that
# scripts/deploy.sh creates from CI/CD variables move to a secrets operator (e.g. External Secrets) or stay a one-off
# step per environment.

workflow:
  name: "$CI_COMMIT_REF_NAME: $CI_COMMIT_TITLE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request gets the MR pipeline only, not a second branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  auto_cancel:
    on_new_commit: interruptible

stages: [validate, staging, production]

variables:
  # Public URLs of the environments (the hosts in environments/<environment>/ingress.yaml); override in the project.
  STAGING_URL: https://staging.products.example.com
  PRODUCTION_URL: https://products.example.com
  # Tool images, pinned (bump them with Renovate or by hand).
  KUBE_TOOLS_IMAGE: alpine/k8s:1.34.11            # bash, kubectl 1.34 (Kustomize), kubeconform, yq, jq, curl
  SHELLCHECK_IMAGE: koalaman/shellcheck-alpine:v0.10.0
  ALLOY_IMAGE: grafana/alloy:v1.10.2              # = the image in infra/logs.yaml
  KUBERNETES_VERSION: "1.34.0"

default:
  interruptible: true

# ─── validate (every merge request and commit) ──────────────────────────────────────────────────────────────────────

# Every environment and infra/ render and are valid (scripts/validate.sh); hands the inline Alloy configuration to
# validate:alloy.
validate:manifests:
  stage: validate
  image: $KUBE_TOOLS_IMAGE
  script:
    - scripts/validate.sh
    - yq 'select(.kind == "ConfigMap" and .metadata.name == "alloy-config") | .data["config.alloy"]' infra/logs.yaml
      > config.alloy
    - test -s config.alloy
  artifacts:
    paths: [config.alloy]
    expire_in: 1 day

# The scripts: shellcheck finds quoting mistakes, unset variables and the like.
validate:scripts:
  stage: validate
  image: $SHELLCHECK_IMAGE
  script:
    - shellcheck scripts/*.sh

# The Alloy configuration (inline in infra/logs.yaml): its components and arguments are valid, and it parses.
validate:alloy:
  stage: validate
  needs: [validate:manifests]
  image:
    name: $ALLOY_IMAGE
    entrypoint: [""]
  script:
    - alloy validate config.alloy
    - alloy fmt config.alloy > /dev/null

# ─── deployment jobs, shared by staging and production ──────────────────────────────────────────────────────────────

# Applies environments/$ENVIRONMENT exactly as committed (scripts/deploy.sh <environment> apps): selects the cluster
# (KUBE_CONTEXT or KUBECONFIG), creates the Secrets gitlab-registry and api-secrets from the CI/CD variables, copies
# the shared Redis' password, applies, waits for the rollouts. The migrations already ran in the backend pipeline.
.deploy:
  image: $KUBE_TOOLS_IMAGE
  interruptible: false
  needs: [validate:manifests]
  script:
    - scripts/deploy.sh "$ENVIRONMENT" apps

# From outside, through the environment's public URL: the gateway, the web app, the API (scripts/smoke.sh).
.smoke:
  image: $KUBE_TOOLS_IMAGE
  script:
    - scripts/smoke.sh "$URL"

# The shared infrastructure (scripts/deploy.sh <environment> infra → scripts/infra.sh up). Always manual and never
# blocking: it holds the data of every service and changes rarely and deliberately. Volumes and passwords are never
# touched by `up`; a new service's database is a separate, one-time step (scripts/create-database.sh).
.infra:
  image: $KUBE_TOOLS_IMAGE
  interruptible: false
  needs: [validate:manifests]
  script:
    - scripts/deploy.sh "$ENVIRONMENT" infra

# ─── staging ────────────────────────────────────────────────────────────────────────────────────────────────────────

deploy:staging:
  extends: .deploy
  stage: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true"
      changes: [environments/staging/**/*, apps/**/*, infra/**/*, scripts/deploy.sh]
  environment:
    name: staging
    url: $STAGING_URL
    deployment_tier: staging
  resource_group: staging
  variables:
    ENVIRONMENT: staging

smoke:staging:
  extends: .smoke
  stage: staging
  needs: [deploy:staging]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true"
      changes: [environments/staging/**/*, apps/**/*, infra/**/*, scripts/deploy.sh]
  environment:
    name: staging
    action: verify
  variables:
    URL: $STAGING_URL

infra:staging:
  extends: .infra
  stage: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true"
      when: manual
      allow_failure: true
  environment:
    name: staging
    action: prepare
  resource_group: staging
  variables:
    ENVIRONMENT: staging

# ─── production (manual, protected) ─────────────────────────────────────────────────────────────────────────────────

# After a release merge request is merged: only users allowed to deploy to the protected `production` environment
# can start it.
deploy:production:
  extends: .deploy
  stage: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PRODUCTION_ENABLED == "true"
      changes: [environments/production/**/*, apps/**/*, scripts/deploy.sh]
      when: manual
  allow_failure: false
  environment:
    name: production
    url: $PRODUCTION_URL
    deployment_tier: production
  resource_group: production
  variables:
    ENVIRONMENT: production

smoke:production:
  extends: .smoke
  stage: production
  needs: [deploy:production]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PRODUCTION_ENABLED == "true"
      changes: [environments/production/**/*, apps/**/*, scripts/deploy.sh]
  environment:
    name: production
    action: verify
  variables:
    URL: $PRODUCTION_URL

infra:production:
  extends: .infra
  stage: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PRODUCTION_ENABLED == "true"
      when: manual
      allow_failure: true
  environment:
    name: production
    action: prepare
  resource_group: production
  variables:
    ENVIRONMENT: production
