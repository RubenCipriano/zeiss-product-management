# CI/CD pipeline of the deploy repository for GitLab: the only place that changes the clusters, and the place that
# decides which versions run. What runs in an environment is what this repository holds (GitOps): environments/<env>
# for the application (the `images:` versions in its kustomization.yaml), infra/ for the shared infrastructure.
#
# Pull model: the backend and frontend pipelines only build and publish images (a git tag vX.Y.Z publishes
# <image>:X.Y.Z); they never touch this repository. This repository pulls versions in:
#   staging      update:staging (a pipeline schedule, e.g. every 15 minutes) sets every image to its newest released
#                version (scripts/update-versions.sh staging → scripts/set-version.sh staging all latest) and, if
#                anything changed, commits "staging: api 1.4.0, web 1.4.0, gateway 1.4.0" to main. That commit's
#                pipeline deploys staging.
#   production   a merge request that changes environments/production (a person runs scripts/set-version.sh, or starts
#                propose:production, which proposes the versions staging runs). Merging it is the release decision.
#
#   validate (every MR and commit) ──► staging (main) ─────────────────────► production (main, manual)
#   manifests (scripts/validate.sh),     deploy:staging: migrate + apply        deploy:production: migrate + apply
#   scripts (shellcheck),                smoke:staging                          smoke:production
#   Alloy configuration                  infra:staging (manual)                 infra:production (manual)
#                                        update:staging (schedule, or manual)   propose:production (manual)
#
# deploy:staging runs on the default branch when a commit changes environments/staging, apps/, infra/ or the deploy
# scripts; deploy:production when it changes environments/production (a merged merge request) or apps/, and waits for
# a person to start it. Both first apply the database migrations with the API image the environment names
# (scripts/migrate.sh), then the manifests. Rollback: scripts/set-version.sh <env> <image> <older version> (or
# `git revert` the version commit) and commit; the pipeline applies it. infra/ is applied only by the manual infra
# jobs: it holds the data of every service. A scheduled pipeline runs only update:staging.
#
# Project- or group-level CI/CD variables (not scoped to an environment: rules cannot see environment-scoped ones):
#   STAGING_ENABLED, PRODUCTION_ENABLED   "true" creates that environment's jobs on the default branch; without them
#                                         the pipeline only validates
#   DEPLOY_PUSH_TOKEN                     masked, protected: a project access token of THIS repository, role
#                                         Maintainer, scope write_repository; update:staging and propose:production
#                                         push with it (a CI job token cannot push)
# A group deploy token named exactly `gitlab-deploy-token` with the scope read_registry on the zeiss group (group →
# Settings → Repository → Deploy tokens): it reads both registries (backend and frontend), and GitLab passes it to the
# jobs as CI_DEPLOY_USER / CI_DEPLOY_PASSWORD; scripts/versions.sh lists the published versions with it and
# scripts/deploy.sh stores it as the Secret gitlab-registry.
#
# Environment-scoped CI/CD variables (staging, production):
#   KUBE_CONTEXT                    <agent configuration project path>:<agent name> (the GitLab agent), or
#   KUBECONFIG                      File: a kubeconfig whose current context is the cluster; one of the two
#   API_SIGNING_KEY                 File, protected: the API's ES256 private key (PEM)          → Secret api-secrets
#   API_CONSUMERS                   File, protected: consumers.json                             → Secret api-secrets
#   SMOKE_CLIENT_ID, SMOKE_CLIENT_SECRET   optional (secret masked): a viewer consumer, for the signed-in smoke check
#   LOKI_URL, LOKI_USERNAME, LOKI_PASSWORD optional, infra jobs: another Loki (scripts/infra.sh)
# STAGING_URL and PRODUCTION_URL (below) are the environments' public hosts (environments/*/ingress.yaml).
#
# The schedule: Build → Pipeline schedules → New schedule, target branch main, interval e.g. "*/15 * * * *".
#
# Argo CD instead of these jobs (prepared in argocd/, README.md "Moving to Argo CD"): Argo CD applies main (automated
# for staging, manual sync for production), the migration runs as its PreSync hook (argocd/hooks), and Argo CD Image
# Updater replaces update:staging. Then the deploy, smoke and update jobs below are switched off and this pipeline
# keeps validate (and propose:production).

workflow:
  name: "$CI_COMMIT_REF_NAME: $CI_COMMIT_TITLE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request gets the MR pipeline only, not a second branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  auto_cancel:
    on_new_commit: interruptible

stages: [validate, staging, production]

variables:
  # Public URLs of the environments (the hosts in environments/<environment>/ingress.yaml); override in the project.
  STAGING_URL: https://staging.products.example.com
  PRODUCTION_URL: https://products.example.com
  # Tool images, pinned (bump them with Renovate or by hand).
  KUBE_TOOLS_IMAGE: alpine/k8s:1.34.11            # bash, kubectl 1.34 (Kustomize), kubeconform, yq, jq, curl
  SHELLCHECK_IMAGE: koalaman/shellcheck-alpine:v0.10.0
  ALLOY_IMAGE: grafana/alloy:v1.10.2              # = the image in infra/logs.yaml
  KUBERNETES_VERSION: "1.34.0"

default:
  interruptible: true

# A scheduled pipeline (the schedule of update:staging) runs only update:staging: in a pipeline that no push started,
# `changes:` is always true, so without this rule every schedule would also deploy.
.not-scheduled:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never

# ─── validate (every merge request and commit) ──────────────────────────────────────────────────────────────────────

# Every environment and infra/ render and are valid (scripts/validate.sh); hands the inline Alloy configuration to
# validate:alloy.
validate:manifests:
  stage: validate
  image: $KUBE_TOOLS_IMAGE
  rules:
    - !reference [.not-scheduled, rules]
    - when: on_success
  script:
    - scripts/validate.sh
    - yq 'select(.kind == "ConfigMap" and .metadata.name == "alloy-config") | .data["config.alloy"]' infra/logs.yaml
      > config.alloy
    - test -s config.alloy
  artifacts:
    paths: [config.alloy]
    expire_in: 1 day

# The scripts: shellcheck finds quoting mistakes, unset variables and the like.
validate:scripts:
  stage: validate
  image: $SHELLCHECK_IMAGE
  rules:
    - !reference [.not-scheduled, rules]
    - when: on_success
  script:
    - shellcheck scripts/*.sh

# The Alloy configuration (inline in infra/logs.yaml): its components and arguments are valid, and it parses.
validate:alloy:
  stage: validate
  needs: [validate:manifests]
  rules:
    - !reference [.not-scheduled, rules]
    - when: on_success
  image:
    name: $ALLOY_IMAGE
    entrypoint: [""]
  script:
    - alloy validate config.alloy
    - alloy fmt config.alloy > /dev/null

# ─── deployment jobs, shared by staging and production ──────────────────────────────────────────────────────────────

# Applies environments/$ENVIRONMENT exactly as committed (scripts/deploy.sh <environment> apps): selects the cluster
# (KUBE_CONTEXT or KUBECONFIG), creates the Secrets gitlab-registry and api-secrets from the CI/CD variables, copies
# the shared Redis' password, applies the database migrations with the environment's API image (scripts/migrate.sh, a
# one-off pod; a failed migration fails the job before anything is applied), applies, waits for the rollouts.
.deploy:
  image: $KUBE_TOOLS_IMAGE
  interruptible: false
  needs: [validate:manifests]
  script:
    - scripts/deploy.sh "$ENVIRONMENT" apps

# From outside, through the environment's public URL: the gateway, the web app, the API (scripts/smoke.sh).
.smoke:
  image: $KUBE_TOOLS_IMAGE
  script:
    - scripts/smoke.sh "$URL"

# The shared infrastructure (scripts/deploy.sh <environment> infra → scripts/infra.sh up). Always manual and never
# blocking: it holds the data of every service and changes rarely and deliberately. Volumes and passwords are never
# touched by `up`; a new service's database is a separate, one-time step (scripts/create-database.sh).
.infra:
  image: $KUBE_TOOLS_IMAGE
  interruptible: false
  needs: [validate:manifests]
  script:
    - scripts/deploy.sh "$ENVIRONMENT" infra

# ─── staging ────────────────────────────────────────────────────────────────────────────────────────────────────────

deploy:staging:
  extends: .deploy
  stage: staging
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true"
      changes: [environments/staging/**/*, apps/**/*, infra/**/*, scripts/deploy.sh, scripts/migrate.sh]
  environment:
    name: staging
    url: $STAGING_URL
    deployment_tier: staging
  resource_group: staging
  variables:
    ENVIRONMENT: staging

smoke:staging:
  extends: .smoke
  stage: staging
  needs: [deploy:staging]
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true"
      changes: [environments/staging/**/*, apps/**/*, infra/**/*, scripts/deploy.sh, scripts/migrate.sh]
  environment:
    name: staging
    action: verify
  variables:
    URL: $STAGING_URL

# Pulls the newest released versions into staging: scripts/update-versions.sh staging sets every image to its newest
# X.Y.Z in the registry (scripts/set-version.sh staging all latest; pre-releases and older versions are never picked)
# and, if anything changed, commits "staging: api 1.4.0, ..." to main with DEPLOY_PUSH_TOKEN. That commit's pipeline
# runs deploy:staging. Runs on the pipeline schedule (Build → Pipeline schedules, on main, e.g. every 15 minutes), and
# can be started by hand in any pipeline on main. To hold staging on an older version, deactivate the schedule first.
update:staging:
  stage: staging
  image: $KUBE_TOOLS_IMAGE
  needs: []
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true"
      when: manual
      allow_failure: true
  script:
    - scripts/update-versions.sh staging

infra:staging:
  extends: .infra
  stage: staging
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $STAGING_ENABLED == "true"
      when: manual
      allow_failure: true
  environment:
    name: staging
    action: prepare
  resource_group: staging
  variables:
    ENVIRONMENT: staging

# ─── production (manual, protected) ─────────────────────────────────────────────────────────────────────────────────

# After a merge request that changes environments/production is merged: only users allowed to deploy to the protected
# `production` environment can start it.
deploy:production:
  extends: .deploy
  stage: production
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PRODUCTION_ENABLED == "true"
      changes: [environments/production/**/*, apps/**/*, scripts/deploy.sh, scripts/migrate.sh]
      when: manual
  allow_failure: false
  environment:
    name: production
    url: $PRODUCTION_URL
    deployment_tier: production
  resource_group: production
  variables:
    ENVIRONMENT: production

smoke:production:
  extends: .smoke
  stage: production
  needs: [deploy:production]
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PRODUCTION_ENABLED == "true"
      changes: [environments/production/**/*, apps/**/*, scripts/deploy.sh, scripts/migrate.sh]
  environment:
    name: production
    action: verify
  variables:
    URL: $PRODUCTION_URL

infra:production:
  extends: .infra
  stage: production
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PRODUCTION_ENABLED == "true"
      when: manual
      allow_failure: true
  environment:
    name: production
    action: prepare
  resource_group: production
  variables:
    ENVIRONMENT: production

# Proposes a production release: scripts/update-versions.sh production sets production's images to the versions staging
# runs and opens the merge request "production: api 1.4.0, ..." (a branch pushed with DEPLOY_PUSH_TOKEN and GitLab's
# merge request push options). Merging it is the release decision; deploy:production then applies it. The same as a
# person running scripts/set-version.sh production ... and opening the merge request by hand. Starting it is limited
# to the users allowed to deploy to the protected `production` environment.
propose:production:
  stage: production
  image: $KUBE_TOOLS_IMAGE
  needs: []
  interruptible: false
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PRODUCTION_ENABLED == "true"
      when: manual
      allow_failure: true
  environment:
    name: production
    action: prepare
  script:
    - scripts/update-versions.sh production
