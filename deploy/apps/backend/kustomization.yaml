# The product-management API, the same in every environment: Deployment (with its configuration as env keys),
# headless Service, autoscaler, disruption budget and network policy. What differs per environment (the database
# and Redis addresses, a few settings, the secrets) is in environments/<environment>. The namespace is here, and only
# here: apps/frontend lives in the same namespace and every environment includes both.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: product-management
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml
