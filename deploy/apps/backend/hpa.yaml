# Adds API replicas when their average CPU passes 60% of the request (200m), removes them when load drops.
# Scale-up reacts within ~30 s; scale-down waits 3 minutes of lower load so a short lull does not remove capacity
# that is needed again a moment later. The ceiling (8) is set by the database: 8 replicas x 10 connections each.
# Needs metrics-server (installed by scripts/infra.sh where missing; built into k3s and most managed
# clusters).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: product-management
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
