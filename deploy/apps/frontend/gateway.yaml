# The gateway: the application's single entry point (nginx, built from gateway/). Routes /api to the API replicas
# (per-request load balancing over the API's headless Service, token verification, rate limiting, 1 s microcache),
# /collect to the log collector and everything else to the web app. Exposed by each environment's overlay: a
# LoadBalancer locally, behind an Ingress with TLS elsewhere.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: product-management
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: product-management
  labels:
    app.kubernetes.io/name: gateway
spec:
  # No `replicas`: the HorizontalPodAutoscaler below owns the count.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: product-management/gateway
          imagePullPolicy: IfNotPresent
          env:
            # Per client IP, for /api only. The API applies its own per-user limits behind this.
            - name: GATEWAY_RATE_LIMIT_RPS
              value: "200"
            - name: GATEWAY_RATE_LIMIT_BURST
              value: "400"
            # Who may tell the gateway the real client address (X-Forwarded-For): nobody by default; the Ingress
            # controller's pod network where there is one (overlays).
            - name: GATEWAY_TRUSTED_PROXIES
              value: 127.0.0.1/32
            # The claims the API's access tokens must carry (verified at the edge: gateway/jwt.js).
            - name: JWT_ISSUER
              value: product-management-api
            - name: JWT_AUDIENCE
              value: product-management-api
            # Set by each environment (environments/<environment>/gateway.yaml):
            #   API_UPSTREAM         the API's headless Service (host:port), one DNS record per API pod
            #   JWKS_URL             the API's public keys, to verify access tokens
            #   COLLECTOR_UPSTREAM   where the browser's error reports go (host:port); empty = /collect answers 204
            #                        and the reports are dropped (no log collector)
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 250m, memory: 32Mi }
            limits: { cpu: "1", memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          # The nginx entrypoint renders its config into /etc/nginx/conf.d at startup, so the root filesystem stays
          # writable for that; caches and temp files go to /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: product-management
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
---
# The gateway handles every request (and answers the cached ones itself), so it scales with traffic too: 2 to 6
# replicas at 70 % of its CPU request.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: product-management
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
