 SET stock_quantity = stock_quantity - 1</tspan><tspan x="60" dy="23">  WHERE id = 123456</tspan><tspan x="60" dy="23">    AND stock_quantity BETWEEN 1 AND …</tspan><tspan x="60" dy="23">  RETURNING …)</tspan><tspan x="60" dy="23">INSERT INTO stock_movements … FROM updated</tspan></text><rect x="693" y="484" width="470" height="210" rx="14" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="690" y="480" width="470" height="210" rx="14" fill="#fff" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><text x="712" y="516" class="h b" font-size="19">what the 300 orders got</text><circle cx="724" cy="552" r="7" fill="#16a34a" stroke="#1f2937" stroke-width="1.6"/><circle cx="744" cy="552" r="7" fill="#16a34a" stroke="#1f2937" stroke-width="1.6"/><circle cx="764" cy="552" r="7" fill="#16a34a" stroke="#1f2937" stroke-width="1.6"/><circle cx="784" cy="552" r="7" fill="#16a34a" stroke="#1f2937" stroke-width="1.6"/><circle cx="804" cy="552" r="7" fill="#16a34a" stroke="#1f2937" stroke-width="1.6"/><circle cx="824" cy="552" r="7" fill="#16a34a" stroke="#1f2937" stroke-width="1.6"/><circle cx="844" cy="552" r="7" fill="#16a34a" stroke="#1f2937" stroke-width="1.6"/><circle cx="864" cy="552" r="7" fill="#16a34a" stroke="#1f2937" stroke-width="1.6"/><circle cx="884" cy="552" r="7" fill="#16a34a" stroke="#1f2937" stroke-width="1.6"/><circle cx="904" cy="552" r="7" fill="#16a34a" stroke="#1f2937" stroke-width="1.6"/><text x="935" y="558" class="h b" font-size="18" style="fill:#16a34a">100 × sold (200 OK)</text><circle cx="724" cy="594" r="7" fill="#dc2626" stroke="#1f2937" stroke-width="1.6"/><circle cx="744" cy="594" r="7" fill="#dc2626" stroke="#1f2937" stroke-width="1.6"/><circle cx="764" cy="594" r="7" fill="#dc2626" stroke="#1f2937" stroke-width="1.6"/><circle cx="784" cy="594" r="7" fill="#dc2626" stroke="#1f2937" stroke-width="1.6"/><circle cx="804" cy="594" r="7" fill="#dc2626" stroke="#1f2937" stroke-width="1.6"/><circle cx="824" cy="594" r="7" fill=