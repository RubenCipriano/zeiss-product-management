<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="850" viewBox="0 0 1200 850" aria-labelledby="t d"><title id="t">300 orders for 100 units → exactly 100 sold</title><desc id="d">Many stock clerks press minus one at the same moment: 300 orders for a product with 100 units, spread over two API copies. All of them arrive at the same row in PostgreSQL, which is locked and changed one statement at a time: UPDATE products SET stock_quantity = stock_quantity - 1 WHERE id = 123456 AND stock_quantity BETWEEN 1 AND the maximum, and the ledger row is inserted by the same statement. Result, measured by the k6 stock-consistency test: 100 orders succeed, 200 get 409 not enough stock, final stock 0.</desc><style>.h{font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive;fill:#1f2937}.m{font-family:Menlo,Consolas,monospace;fill:#1f2937}.b{font-weight:700}</style><defs><filter id="r" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="1200" height="850" fill="#fffdf8"/><path d="M34 72 Q470 67 906 70" stroke="#fde68a" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.95"/><text x="40" y="66" class="h b" font-size="40">300 orders for 100 units → exactly 100 sold</text><text x="40" y="106" class="h" font-size="20" style="fill:#4b5563">the k6 stock-consistency test, through two API copies</text><path d="M49.8 205.1 Q49 184.2 62 183.5 Q75 184.2 74.2 205.1 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="1.8" stroke-linejoin="round"/><circle cx="62" cy="172" r="7.9" fill="#a78bfa" stroke="#6d28d9" stroke-width="1.8"/><path d="M101.8 205.1 Q101 184.2 114 183.5 Q127 184.2 126.2 205.1 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="1.8" stroke-linejoin="round"/><circle cx="114" cy="172" r="7.9" fill="#a78bfa" stroke="#6d28d9" st