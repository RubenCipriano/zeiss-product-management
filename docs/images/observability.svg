<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="940" viewBox="0 0 1200 940" aria-labelledby="t d"><title id="t">Logs only, one trace id</title><desc id="d">The browser reports its errors (errors only, with the Grafana Faro SDK) to the gateway's /collect, which forwards them to Alloy's faro.receiver in the cluster. A request reaches the nginx gateway, which keeps a valid incoming traceparent header or builds one from its request id, writes the trace_id in its JSON access-log line and sends the traceparent to the API. The API continues that trace and writes the same id as TraceId in every log line of the request. Both write JSON to stdout. Alloy, in the cluster, reads every pod log and pushes it to Loki on the monitoring server, which keeps them for 14 days; the server agent does the same for PostgreSQL and Redis. Grafana reads Loki: two dashboards (Product Management, Logs), twelve LogQL alert rules, and a link from any trace_id to every log line of that request. No traces and no metrics are collected: the access log already holds rate, errors, latency and cache hits.</desc><style>.h{font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive;fill:#1f2937}.m{font-family:Menlo,Consolas,monospace;fill:#1f2937}.b{font-weight:700}</style><defs><filter id="r" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="1200" height="940" fill="#fffdf8"/><path d="M34 72 Q281.5 67 529 70" stroke="#fde68a" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.95"/><text x="40" y="66" class="h b" font-size="42">Logs only, one trace id</text><text x="40" y="106" class="h" font-size="20" style="fill:#4b5563">one request followed from the gateway to the API, the browser's errors beside it</text><path d="M53 251 Q52 222 70 221 Q88 222 87 251 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="2.5" stroke-linejoin="round"/><circle cx="70" cy="205" r="11" fill="#a78bfa" stroke="#6d28d9" stroke-width="2.5"/><text x="70" y="278" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">a browser</text><path d="M100 225 Q128 225 156 225" fill="none" stroke="#6d28d9" stroke-width="2.6" stroke-linecap="round"/><path d="M142.8 217.8 L156 225 M142.8 232.2 L156 225" fill="none" stroke="#6d28d9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128" cy="225" r="6" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><path d="M112 262 Q134 262 156 262" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/><path d="M142.8 254.8 L156 262 M142.8 269.2 L156 262" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 302 L200 318 L138 318 L138 566 L156 566" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M142.8 558.8 L156 566 M142.8 573.2 L156 566" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="22" y="410" class="h b" font-size="15" style="fill:#dc2626"><tspan x="22">browser</tspan><tspan x="22" dy="20">errors:</tspan></text><text x="22" y="452" class="h" font-size="14"><tspan x="22">Faro SDK</tspan><tspan x="22" dy="20">→ <tspan class="m">/collect</tspan></tspan><tspan x="22" dy="20">→ Alloy</tspan></text><rect x="163" y="164" width="310" height="140" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="160" y="160" width="310" height="140" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="168" y="174" width="7" height="112" rx="3.5" fill="#0d9488"/><text x="186" y="194" class="h b" font-size="22">gateway</text><text x="290" y="194" class="h" font-size="17" style="fill:#4b5563">(nginx)</text><text x="186" y="224" class="h" font-size="16">keeps or creates a W3C</text><text x="186" y="248" class="h" font-size="16"><tspan class="m">traceparent</tspan> per request</text><text x="186" y="280" class="m" font-size="14" style="fill:#4b5563">trace.js</text><rect x="643" y="164" width="310" height="140" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="640" y="160" width="310" height="140" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="648" y="174" width="7" height="112" rx="3.5" fill="#7c3aed"/><text x="666" y="194" class="h b" font-size="22">API</text><text x="712" y="194" class="h" font-size="17" style="fill:#4b5563">(ASP.NET Core)</text><text x="666" y="224" class="h" font-size="16">continues the trace: its id</text><text x="666" y="248" class="h" font-size="16">is in every log line</text><text x="666" y="280" class="m" font-size="14" style="fill:#4b5563">LoggingExtensions.cs</text><path d="M472 230 Q554 230 636 230" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><path d="M622.8 222.8 L636 230 M622.8 237.2 L636 230" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="554" cy="230" r="6" fill="#f97316" stroke="#1f2937" stroke-width="1.6"/><text x="555" y="214" class="m" font-size="14" text-anchor="middle">traceparent</text><path d="M980 175 V235 A55 10 0 0 0 1090 235 V175 Z" fill="#ede9fe" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><ellipse cx="1035" cy="175" rx="55" ry="10" fill="#ede9fe" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><text x="1035" y="222" class="h b" font-size="15" text-anchor="middle">PostgreSQL</text><rect x="990" y="255" width="110" height="52" rx="16" fill="#fff" stroke="#1f2937" stroke-width="2.2" filter="url(#r)"/><rect x="998" y="269" width="7" height="24" rx="3.5" fill="#7c3aed"/><path d="M1020.4 269 L1012 282.8 L1018 282.8 L1015.6 293 L1024 278.6 L1018 278.6 L1020.4 269 Z" fill="#facc15" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/><text x="1066" y="287" class="h b" font-size="15" text-anchor="middle">Redis</text><text x="1160" y="283" class="h" font-size="15" text-anchor="end" style="fill:#4b5563">servers</text><text x="160" y="350" class="h" font-size="15" style="fill:#4b5563">stdout, one JSON line per request</text><path d="M315 302 Q315 316 315 330" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M322.2 316.8 L315 330 M307.8 316.8 L315 330" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="160" y="362" width="360" height="112" rx="10" fill="#fff" stroke="#1f2937" stroke-width="2"/><rect x="269.2" y="375" width="166" height="17" rx="4" fill="#fde68a" opacity="0.95"/><text x="174" y="388" class="m" font-size="13.5">{"trace_id":"24bd3191b2a50b27…",</text><text x="174" y="409" class="m" font-size="13.5"> "user":"manager","method":"POST",</text><text x="174" y="430" class="m" font-size="13.5"> "uri":"/api/products","status":201,</text><text x="174" y="451" class="m" font-size="13.5"> "upstream":"10.1.1.131:8080"}</text><text x="640" y="350" class="h" font-size="15" style="fill:#4b5563">stdout, every line of the request</text><path d="M795 302 Q795 316 795 330" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M802.2 316.8 L795 330 M787.8 316.8 L795 330" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="570" y="362" width="390" height="112" rx="10" fill="#fff" stroke="#1f2937" stroke-width="2"/><rect x="687.3" y="438" width="166" height="17" rx="4" fill="#fde68a" opacity="0.95"/><text x="584" y="388" class="m" font-size="13.5">{"LogLevel":"Information",</text><text x="584" y="409" class="m" font-size="13.5"> "Message":"Created product 950819…",</text><text x="584" y="430" class="m" font-size="13.5"> "Scopes":[{</text><text x="584" y="451" class="m" font-size="13.5">   "TraceId":"24bd3191b2a50b27…"}]}</text><path d="M430 480 Q555 506 680 480" fill="none" stroke="#f97316" stroke-width="2.4" stroke-linecap="round"/><path d="M665.6 475.6 L680 480 M668.6 489.7 L680 480" fill="none" stroke="#f97316" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M441.4 489.7 L430 480 M444.4 475.6 L430 480" fill="none" stroke="#f97316" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="555" y="518" class="h b" font-size="17" text-anchor="middle" style="fill:#f97316">the same id</text><rect x="990" y="362" width="190" height="112" rx="10" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="1004" y="388" class="m" font-size="13">LOG: duration:</text><text x="1004" y="409" class="m" font-size="13"> … ms statement:</text><text x="1004" y="430" class="m" font-size="13"> SELECT …</text><path d="M1085 309 Q1085 333.5 1085 358" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M1092.2 344.8 L1085 358 M1077.8 344.8 L1085 358" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="163" y="534" width="800" height="72" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="160" y="530" width="800" height="72" rx="16" fill="#fff" stroke="#1f2937" stroke-width="2.6" filter="url(#r)"/><rect x="168" y="544" width="7" height="44" rx="3.5" fill="#f97316"/><text x="186" y="560" class="h b" font-size="19">Alloy, in the cluster</text><text x="186" y="586" class="h" font-size="15">reads every pod's log (trace_id, level searchable); faro.receiver takes the browser's errors</text><path d="M250 476 Q250 501 250 526" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 5"/><path d="M257.2 512.8 L250 526 M242.8 512.8 L250 526" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M900 476 Q900 501 900 526" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 5"/><path d="M907.2 512.8 L900 526 M892.8 512.8 L900 526" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="993" y="534" width="190" height="72" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="990" y="530" width="190" height="72" rx="16" fill="#fff" stroke="#1f2937" stroke-width="2.6" filter="url(#r)"/><rect x="998" y="544" width="7" height="44" rx="3.5" fill="#f97316"/><text x="1012" y="560" class="h b" font-size="17">server agent</text><text x="1012" y="586" class="h" font-size="15" style="fill:#4b5563">(Alloy)</text><path d="M1085 476 Q1085 501 1085 526" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 5"/><path d="M1092.2 512.8 L1085 526 M1077.8 512.8 L1085 526" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="160" y="640" width="1020" height="200" rx="18" fill="#fffdf8" stroke="#1f2937" stroke-width="2" stroke-dasharray="9 7" filter="url(#r)"/><text x="180" y="670" class="h b" font-size="18">monitoring server (outside the cluster)</text><rect x="183" y="694" width="330" height="130" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="180" y="690" width="330" height="130" rx="16" fill="#fff7ed" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><text x="204" y="724" class="h b" font-size="22">Loki</text><text x="262" y="724" class="m" font-size="15" style="fill:#4b5563">:3100</text><text x="204" y="754" class="h" font-size="15">labels: namespace, app, level</text><text x="204" y="779" class="h" font-size="15">trace_id per line</text><text x="204" y="804" class="h" font-size="15">kept 14 days (<tspan class="m">pm-loki-data</tspan>)</text><rect x="583" y="694" width="580" height="130" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="580" y="690" width="580" height="130" rx="16" fill="#fff7ed" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><text x="604" y="724" class="h b" font-size="22">Grafana</text><text x="700" y="724" class="m" font-size="15" style="fill:#4b5563">:3000</text><text x="604" y="754" class="h" font-size="15">dashboards: Product Management (the numbers), Logs (every line)</text><text x="604" y="779" class="h" font-size="15">12 alert rules, all LogQL, each with a runbook</text><text x="604" y="804" class="h" font-size="15">trace_id → "All logs of this request"</text><path d="M512 755 Q544 755 576 755" fill="none" stroke="#f97316" stroke-width="2.8" stroke-linecap="round"/><path d="M562.8 747.8 L576 755 M562.8 762.2 L576 755" fill="none" stroke="#f97316" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 604 Q455.4 652.5 345 686" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 5"/><path d="M359.7 689.1 L345 686 M355.5 675.3 L345 686" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1085 604 Q754.7 662.9 420 686" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 5"/><path d="M433.6 692.3 L420 686 M432.6 677.9 L420 686" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="20" y="860" width="1160" height="62" rx="6" fill="#fff7cc" stroke="#1f2937" stroke-width="2" filter="url(#r)"/><rect x="566" y="851" width="68" height="18" rx="3" fill="#d1d5db" opacity="0.8"/></g><text x="600" y="898" class="h" font-size="17" text-anchor="middle">no traces, no metrics: the access log already holds rate, errors, latency and cache hits</text></svg>