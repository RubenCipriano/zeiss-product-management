<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="995" viewBox="0 0 1200 995" aria-labelledby="t d"><title id="t">Logs only, one trace id</title><desc id="d">The browser reports its errors (errors only, with the Grafana Faro SDK) to the gateway's /collect, which forwards them to the Service alloy-faro on port 12347, Alloy's faro.receiver. A request reaches the nginx gateway, which keeps a valid incoming traceparent header or builds one from its request id, writes the trace_id in its JSON access-log line and sends the traceparent to the API. The API continues that trace and writes the same id as TraceId in every log line of the request. Both write JSON to stdout. Alloy, a Deployment in the namespace infra, reads the log of every pod in every namespace through the Kubernetes API, including PostgreSQL, Redis, Loki, Grafana and the backup job, and pushes it to Loki, a StatefulSet in infra that keeps the logs for 14 days on its volume, labelled for example namespace infra and app postgres. Grafana, a Deployment in infra provisioned from ConfigMaps, reads Loki: two dashboards (Product Management, Logs), twelve LogQL alert rules, and a link from any trace_id to every log line of that request; it is reached with kubectl port-forward. No traces and no metrics are collected: the access log already holds rate, errors, latency and cache hits.</desc><style>.h{font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive;fill:#1f2937}.m{font-family:Menlo,Consolas,monospace;fill:#1f2937}.b{font-weight:700}</style><defs><filter id="r" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="1200" height="995" fill="#fffdf8"/><path d="M34 72 Q281.5 67 529 70" stroke="#fde68a" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.95"/><text x="40" y="66" class="h b" font-size="42">Logs only, one trace id</text><text x="40" y="106" class="h" font-size="20" style="fill:#4b5563">one request followed from the gateway to the API, the browser's errors beside it</text><path d="M53 251 Q52 222 70 221 Q88 222 87 251 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="2.5" stroke-linejoin="round"/><circle cx="70" cy="205" r="11" fill="#a78bfa" stroke="#6d28d9" stroke-width="2.5"/><text x="70" y="278" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">a browser</text><path d="M100 225 Q128 225 156 225" fill="none" stroke="#6d28d9" stroke-width="2.6" stroke-linecap="round"/><path d="M142.8 217.8 L156 225 M142.8 232.2 L156 225" fill="none" stroke="#6d28d9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128" cy="225" r="6" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><path d="M112 262 Q134 262 156 262" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/><path d="M142.8 254.8 L156 262 M142.8 269.2 L156 262" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 302 L200 318 L132 318 L132 612 L161 612" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M147.8 604.8 L161 612 M147.8 619.2 L161 612" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="18" y="400" class="h b" font-size="15" style="fill:#dc2626"><tspan x="18">browser</tspan><tspan x="18" dy="20">errors:</tspan></text><text x="18" y="442" class="h" font-size="14"><tspan x="18">Faro SDK</tspan><tspan x="18" dy="20">→ <tspan class="m">/collect</tspan></tspan><tspan x="18" dy="20">→ Alloy</tspan></text><rect x="163" y="164" width="310" height="140" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="160" y="160" width="310" height="140" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="168" y="174" width="7" height="112" rx="3.5" fill="#0d9488"/><text x="186" y="194" class="h b" font-size="22">gateway</text><text x="290" y="194" class="h" font-size="17" style="fill:#4b5563">(nginx)</text><text x="186" y="224" class="h" font-size="16">keeps or creates a W3C</text><text x="186" y="248" class="h" font-size="16"><tspan class="m">traceparent</tspan> per request</text><text x="186" y="280" class="m" font-size="14" style="fill:#4b5563">trace.js</text><rect x="643" y="164" width="310" height="140" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="640" y="160" width="310" height="140" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="648" y="174" width="7" height="112" rx="3.5" fill="#7c3aed"/><text x="666" y="194" class="h b" font-size="22">API</text><text x="712" y="194" class="h" font-size="17" style="fill:#4b5563">(ASP.NET Core)</text><text x="666" y="224" class="h" font-size="16">continues the trace: its id</text><text x="666" y="248" class="h" font-size="16">is in every log line</text><text x="666" y="280" class="m" font-size="14" style="fill:#4b5563">LoggingExtensions.cs</text><path d="M472 230 Q554 230 636 230" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><path d="M622.8 222.8 L636 230 M622.8 237.2 L636 230" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="554" cy="230" r="6" fill="#f97316" stroke="#1f2937" stroke-width="1.6"/><text x="555" y="214" class="m" font-size="14" text-anchor="middle">traceparent</text><text x="1085" y="154" class="h" font-size="15" text-anchor="middle" style="fill:#4b5563">pods in <tspan class="m">infra</tspan></text><path d="M980 175 V235 A55 10 0 0 0 1090 235 V175 Z" fill="#ede9fe" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><ellipse cx="1035" cy="175" rx="55" ry="10" fill="#ede9fe" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><text x="1035" y="222" class="h b" font-size="15" text-anchor="middle">postgres</text><rect x="990" y="255" width="110" height="52" rx="16" fill="#fff" stroke="#1f2937" stroke-width="2.2" filter="url(#r)"/><rect x="998" y="269" width="7" height="24" rx="3.5" fill="#7c3aed"/><path d="M1020.4 269 L1012 282.8 L1018 282.8 L1015.6 293 L1024 278.6 L1018 278.6 L1020.4 269 Z" fill="#facc15" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/><text x="1066" y="287" class="h b" font-size="15" text-anchor="middle">redis</text><text x="160" y="350" class="h" font-size="15" style="fill:#4b5563">stdout, one JSON line per request</text><path d="M315 302 Q315 316 315 330" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M322.2 316.8 L315 330 M307.8 316.8 L315 330" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="160" y="362" width="360" height="112" rx="10" fill="#fff" stroke="#1f2937" stroke-width="2"/><rect x="269.2" y="375" width="166" height="17" rx="4" fill="#fde68a" opacity="0.95"/><text x="174" y="388" class="m" font-size="13.5">{"trace_id":"24bd3191b2a50b27…",</text><text x="174" y="409" class="m" font-size="13.5"> "user":"manager","method":"POST",</text><text x="174" y="430" class="m" font-size="13.5"> "uri":"/api/products","status":201,</text><text x="174" y="451" class="m" font-size="13.5"> "upstream":"10.1.1.131:8080"}</text><text x="640" y="350" class="h" font-size="15" style="fill:#4b5563">stdout, every line of the request</text><path d="M795 302 Q795 316 795 330" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M802.2 316.8 L795 330 M787.8 316.8 L795 330" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="570" y="362" width="390" height="112" rx="10" fill="#fff" stroke="#1f2937" stroke-width="2"/><rect x="687.3" y="438" width="166" height="17" rx="4" fill="#fde68a" opacity="0.95"/><text x="584" y="388" class="m" font-size="13.5">{"LogLevel":"Information",</text><text x="584" y="409" class="m" font-size="13.5"> "Message":"Created product 950819…",</text><text x="584" y="430" class="m" font-size="13.5"> "Scopes":[{</text><text x="584" y="451" class="m" font-size="13.5">   "TraceId":"24bd3191b2a50b27…"}]}</text><path d="M430 480 Q555 506 680 480" fill="none" stroke="#f97316" stroke-width="2.4" stroke-linecap="round"/><path d="M665.6 475.6 L680 480 M668.6 489.7 L680 480" fill="none" stroke="#f97316" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M441.4 489.7 L430 480 M444.4 475.6 L430 480" fill="none" stroke="#f97316" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="555" y="518" class="h b" font-size="17" text-anchor="middle" style="fill:#f97316">the same id</text><rect x="990" y="362" width="190" height="112" rx="10" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="1004" y="388" class="m" font-size="13">LOG: duration:</text><text x="1004" y="409" class="m" font-size="13"> … ms statement:</text><text x="1004" y="430" class="m" font-size="13"> SELECT …</text><path d="M1085 309 Q1085 319.5 1085 330" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M1092.2 316.8 L1085 330 M1077.8 316.8 L1085 330" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="990" y="350" class="h" font-size="14" style="fill:#4b5563">also loki, grafana, backup</text><rect x="145" y="540" width="1045" height="352" rx="18" fill="#fffdf8" stroke="#1f2937" stroke-width="2" stroke-dasharray="9 7" filter="url(#r)"/><rect x="168" y="564" width="1005" height="104" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="165" y="560" width="1005" height="104" rx="16" fill="#fff" stroke="#1f2937" stroke-width="2.6" filter="url(#r)"/><rect x="173" y="574" width="7" height="76" rx="3.5" fill="#f97316"/><text x="191" y="591" class="h b" font-size="20">Alloy</text><text x="252" y="591" class="h" font-size="15" style="fill:#4b5563">Deployment</text><text x="191" y="619" class="h" font-size="15">reads every pod's log in every namespace through the Kubernetes API (trace_id, level searchable)</text><text x="191" y="645" class="h" font-size="15">faro.receiver behind svc <tspan class="m">alloy-faro</tspan> :12347 takes the browser's errors</text><path d="M250 476 Q250 516 250 556" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 5"/><path d="M257.2 542.8 L250 556 M242.8 542.8 L250 556" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M900 476 Q900 516 900 556" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 5"/><path d="M907.2 542.8 L900 556 M892.8 542.8 L900 556" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1085 476 Q1085 516 1085 556" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 5"/><path d="M1092.2 542.8 L1085 556 M1077.8 542.8 L1085 556" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="168" y="708" width="425" height="146" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="165" y="704" width="425" height="146" rx="16" fill="#fff7ed" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><text x="189" y="738" class="h b" font-size="22">Loki</text><text x="247" y="738" class="h" font-size="15" style="fill:#4b5563">StatefulSet :3100</text><text x="189" y="766" class="h" font-size="15">labels: namespace, app, level</text><text x="189" y="790" class="m" font-size="13.5">{namespace="infra", app="postgres"}</text><text x="189" y="816" class="h" font-size="15">trace_id per line</text><text x="189" y="840" class="h" font-size="15">kept 14 days (PVC <tspan class="m">data-loki-0</tspan>)</text><rect x="643" y="708" width="530" height="146" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="640" y="704" width="530" height="146" rx="16" fill="#fff7ed" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><text x="664" y="738" class="h b" font-size="22">Grafana</text><text x="760" y="738" class="h" font-size="15" style="fill:#4b5563">Deployment :3000</text><text x="664" y="766" class="h" font-size="15">dashboards Product Management, Logs; 12 alert rules</text><text x="664" y="790" class="h" font-size="15">(LogQL, each with a runbook), all from ConfigMaps</text><text x="664" y="816" class="h" font-size="15">trace_id → "All logs of this request"</text><text x="664" y="840" class="m" font-size="13">kubectl -n infra port-forward svc/grafana 3000:3000</text><path d="M377 666 Q377 683 377 700" fill="none" stroke="#f97316" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 5"/><path d="M384.2 686.8 L377 700 M369.8 686.8 L377 700" fill="none" stroke="#f97316" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M594 777 Q615 777 636 777" fill="none" stroke="#f97316" stroke-width="2.8" stroke-linecap="round"/><path d="M622.8 769.8 L636 777 M622.8 784.2 L636 777" fill="none" stroke="#f97316" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="878" class="h b" font-size="17">namespace: infra</text><text x="1170" y="878" class="h" font-size="15" text-anchor="end" style="fill:#4b5563">or Alloy pushes to an external Loki (<tspan class="m">LOKI_URL</tspan>)</text><g><rect x="20" y="916" width="1160" height="62" rx="6" fill="#fff7cc" stroke="#1f2937" stroke-width="2" filter="url(#r)"/><rect x="566" y="907" width="68" height="18" rx="3" fill="#d1d5db" opacity="0.8"/></g><text x="600" y="954" class="h" font-size="17" text-anchor="middle">no traces, no metrics: the access log already holds rate, errors, latency and cache hits</text></svg>