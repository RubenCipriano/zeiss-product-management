<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="900" viewBox="0 0 1200 900" aria-labelledby="t d"><title id="t">What a change invalidates</title><desc id="d">Redis cache keys carry generation counters. When a stock clerk adds 10 units to product 123456, the data generation and the generation of product 123456 go up by one, and the listing generation stays the same: lists keep their cached ids and counts, and because rows are always read fresh the new stock shows anyway. When a manager renames the product, all three go up by one. Example key: v1791551739412.1791551802077:product:123456, the listing generation, then the product generation, then what is cached; after the stock change the product number is one higher, so the old entry is never read again and expires on its own.</desc><style>.h{font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive;fill:#1f2937}.m{font-family:Menlo,Consolas,monospace;fill:#1f2937}.b{font-weight:700}</style><defs><filter id="r" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="1200" height="900" fill="#fffdf8"/><path d="M34 72 Q302.5 67 571 70" stroke="#fde68a" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.95"/><text x="40" y="66" class="h b" font-size="42">What a change invalidates</text><text x="40" y="106" class="h" font-size="20" style="fill:#4b5563">every Redis key carries counters ("generations"); a change moves counters on, never deletes</text><text x="565" y="168" class="h b" font-size="20" text-anchor="middle">data</text><text x="565" y="190" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">generation</text><text x="565" y="216" class="h" font-size="16" text-anchor="middle" style="fill:#4b5563"><tspan x="565">used by stock-level</tspan><tspan x="565" dy="20">pages</tspan></text><text x="820" y="168" class="h b" font-size="20" text-anchor="middle">listing</text><text x="820" y="190" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">generation</text><text x="820" y="216" class="h" font-size="16" text-anchor="middle" style="fill:#4b5563"><tspan x="820">used by list + search</tspan><tspan x="820" dy="20">counts and page ids,</tspan><tspan x="820" dy="20">and every product key</tspan></text><text x="1075" y="168" class="h b" font-size="20" text-anchor="middle">product #123456</text><text x="1075" y="190" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">generation</text><text x="1075" y="216" class="h" font-size="16" text-anchor="middle" style="fill:#4b5563"><tspan x="1075">used by its details</tspan><tspan x="1075" dy="20">and stock history</tspan></text><path d="M58.8 368.5 Q57.5 332.2 80 331 Q102.5 332.2 101.2 368.5 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="3.1" stroke-linejoin="round"/><circle cx="80" cy="311" r="13.8" fill="#a78bfa" stroke="#6d28d9" stroke-width="3.1"/><text x="80" y="395" class="h" font-size="18" text-anchor="middle">stock clerk</text><path d="M154 285 H406 Q420 285 420 299 V333 Q420 347 406 347 H154 Q140 347 140 333 V325 L112 335 L140 309 V299 Q140 285 154 285 Z" fill="#fff" stroke="#1f2937" stroke-width="2.6" stroke-linejoin="round" filter="url(#r)"/><text x="280" y="324" class="h b" font-size="22" text-anchor="middle">+10 to #123456</text><text x="280" y="381" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">a stock change</text><rect x="470" y="311" width="190" height="46" rx="9" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><rect x="476" y="317" width="178" height="34" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/><text x="565" y="340" class="m" font-size="17" text-anchor="middle" style="fill:#f9fafb">1791551803121</text><circle cx="660" cy="311" r="19" fill="#16a34a" stroke="#1f2937" stroke-width="2"/><text x="660" y="317.5" class="h b" font-size="18" text-anchor="middle" style="fill:#fff">+1</text><rect x="725" y="311" width="190" height="46" rx="9" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><rect x="731" y="317" width="178" height="34" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/><text x="820" y="340" class="m" font-size="17" text-anchor="middle" style="fill:#f9fafb">1791551739412</text><circle cx="915" cy="311" r="19" fill="#6b7280" stroke="#1f2937" stroke-width="2"/><text x="915" y="317.5" class="h b" font-size="18" text-anchor="middle" style="fill:#fff">=</text><rect x="980" y="311" width="190" height="46" rx="9" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><rect x="986" y="317" width="178" height="34" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/><text x="1075" y="340" class="m" font-size="17" text-anchor="middle" style="fill:#f9fafb">1791551802078</text><circle cx="1170" cy="311" r="19" fill="#16a34a" stroke="#1f2937" stroke-width="2"/><text x="1170" y="317.5" class="h b" font-size="18" text-anchor="middle" style="fill:#fff">+1</text><g transform="rotate(-0.5 820 423)"><rect x="470" y="391" width="700" height="64" rx="6" fill="#fff7cc" stroke="#1f2937" stroke-width="2" filter="url(#r)"/><rect x="786" y="382" width="68" height="18" rx="3" fill="#d1d5db" opacity="0.8"/></g><text x="820" y="418" class="h" font-size="17" text-anchor="middle">lists keep their cached ids and counts; rows are read fresh,</text><text x="820" y="442" class="h" font-size="17" text-anchor="middle">so the new stock shows anyway</text><path d="M58.8 608.5 Q57.5 572.2 80 571 Q102.5 572.2 101.2 608.5 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="3.1" stroke-linejoin="round"/><circle cx="80" cy="551" r="13.8" fill="#a78bfa" stroke="#6d28d9" stroke-width="3.1"/><text x="80" y="635" class="h" font-size="18" text-anchor="middle">manager</text><path d="M154 525 H406 Q420 525 420 539 V573 Q420 587 406 587 H154 Q140 587 140 573 V565 L112 575 L140 549 V539 Q140 525 154 525 Z" fill="#fff" stroke="#1f2937" stroke-width="2.6" stroke-linejoin="round" filter="url(#r)"/><text x="280" y="564" class="h b" font-size="22" text-anchor="middle">rename #123456</text><text x="280" y="621" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">an edit (also create, delete)</text><rect x="470" y="551" width="190" height="46" rx="9" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><rect x="476" y="557" width="178" height="34" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/><text x="565" y="580" class="m" font-size="17" text-anchor="middle" style="fill:#f9fafb">1791551803122</text><circle cx="660" cy="551" r="19" fill="#16a34a" stroke="#1f2937" stroke-width="2"/><text x="660" y="557.5" class="h b" font-size="18" text-anchor="middle" style="fill:#fff">+1</text><rect x="725" y="551" width="190" height="46" rx="9" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><rect x="731" y="557" width="178" height="34" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/><text x="820" y="580" class="m" font-size="17" text-anchor="middle" style="fill:#f9fafb">1791551739413</text><circle cx="915" cy="551" r="19" fill="#16a34a" stroke="#1f2937" stroke-width="2"/><text x="915" y="557.5" class="h b" font-size="18" text-anchor="middle" style="fill:#fff">+1</text><rect x="980" y="551" width="190" height="46" rx="9" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><rect x="986" y="557" width="178" height="34" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/><text x="1075" y="580" class="m" font-size="17" text-anchor="middle" style="fill:#f9fafb">1791551802079</text><circle cx="1170" cy="551" r="19" fill="#16a34a" stroke="#1f2937" stroke-width="2"/><text x="1170" y="557.5" class="h b" font-size="18" text-anchor="middle" style="fill:#fff">+1</text><text x="820" y="641" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">lists and searches are computed again on their next read</text><line x1="40" y1="680" x2="1160" y2="680" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.5"/><text x="40" y="726" class="h b" font-size="21">A product key, before and after the +10:</text><text x="194" y="774" class="h" font-size="18" text-anchor="end" style="fill:#4b5563">before</text><text x="194" y="814" class="h" font-size="18" text-anchor="end" style="fill:#4b5563">after</text><text x="210" y="774" class="m" font-size="22">v1791551739412.1791551802077:product:123456</text><text x="210" y="814" class="m" font-size="22">v1791551739412.179155180207<tspan style="fill:#16a34a;font-weight:700">8</tspan>:product:123456</text><path d="M224 826 Q224 836 234 836 H390 Q400 836 400 826" fill="none" stroke="#6b7280" stroke-width="2.4"/><path d="M418 826 Q418 836 428 836 H584 Q594 836 594 826" fill="none" stroke="#16a34a" stroke-width="2.4"/><text x="312" y="866" class="h" font-size="18" text-anchor="middle" style="fill:#4b5563">listing</text><text x="506" y="866" class="h b" font-size="18" text-anchor="middle" style="fill:#16a34a">product #123456</text><text x="710" y="866" class="h" font-size="18" text-anchor="middle" style="fill:#4b5563">what is cached</text><g transform="rotate(1.2 1010 792)"><rect x="860" y="732" width="300" height="120" rx="6" fill="#fff7cc" stroke="#1f2937" stroke-width="2" filter="url(#r)"/><rect x="976" y="723" width="68" height="18" rx="3" fill="#d1d5db" opacity="0.8"/></g><text x="1010" y="768" class="h" font-size="17" text-anchor="middle"><tspan x="1010">new number → new key.</tspan><tspan x="1010" dy="22">Nobody reads the old</tspan><tspan x="1010" dy="22">entry again; it expires</tspan><tspan x="1010" dy="22">on its own.</tspan></text></svg>