<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="890" viewBox="0 0 1200 890" aria-labelledby="t d"><title id="t">More traffic → more API copies (but the database is the ceiling)</title><desc id="d">More requests raise the CPU of the API copies. metrics-server measures every pod; the HorizontalPodAutoscaler for the API decides: average CPU over 60 percent adds up to 2 copies every 30 seconds, at most 8; quiet for 3 minutes removes 1 copy per minute, at least 2. A new copy that passes its readiness check is listed by the DNS name of the headless Service api and the gateway, which re-reads that list every 5 seconds, sends it traffic. The gateway has its own autoscaler, 2 to 6 copies at 70 percent. The database is the ceiling: 8 copies times 10 database connections is 80, and more copies than the database can serve only add waiting.</desc><style>.h{font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive;fill:#1f2937}.m{font-family:Menlo,Consolas,monospace;fill:#1f2937}.b{font-weight:700}</style><defs><filter id="r" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="1200" height="890" fill="#fffdf8"/><path d="M34 72 Q355 67 676 70" stroke="#fde68a" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.95"/><text x="40" y="66" class="h b" font-size="42">More traffic → more API copies</text><text x="40" y="106" class="h" font-size="20" style="fill:#4b5563">… but the database is the ceiling</text><path d="M46.4 216.8 Q45.6 193.6 60 192.8 Q74.4 193.6 73.6 216.8 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="2" stroke-linejoin="round"/><circle cx="60" cy="180" r="8.8" fill="#a78bfa" stroke="#6d28d9" stroke-width="2"/><path d="M96.4 216.8 Q95.6 193.6 110 192.8 Q124.4 193.6 123.6 216.8 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="2" stroke-linejoin="round"/><circle cx="110" cy="180" r="8.8" fill="#a78bfa" stroke="#6d28d9" stroke-width="2"/><path d="M71.4 276.8 Q70.6 253.6 85 252.8 Q99.4 253.6 98.6 276.8 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="2" stroke-linejoin="round"/><circle cx="85" cy="240" r="8.8" fill="#a78bfa" stroke="#6d28d9" stroke-width="2"/><path d="M135 250 Q178.5 259 222 268" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/><path d="M210.6 258.3 L222 268 M207.7 272.4 L222 268" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="150.7" cy="253.2" r="6" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><circle cx="178.5" cy="259" r="6" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><circle cx="206.3" cy="264.8" r="6" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><text x="95" y="320" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">more requests</text><path d="M240 280 A80 80 0 0 1 344.7 203.9" fill="none" stroke="#bbf7d0" stroke-width="22"/><path d="M344.7 203.9 A80 80 0 0 1 400 280" fill="none" stroke="#fed7aa" stroke-width="22"/><path d="M227 280 A93 93 0 0 1 413 280" fill="none" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><line x1="223" y1="280" x2="417" y2="280" stroke="#1f2937" stroke-width="3"/><line x1="340.4" y1="217.2" x2="349.7" y2="188.7" stroke="#dc2626" stroke-width="3"/><line x1="320" y1="280" x2="377" y2="232.8" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><circle cx="320" cy="280" r="7" fill="#1f2937"/><text x="320" y="316" class="h b" font-size="18" text-anchor="middle">API CPU</text><text x="320" y="340" class="h" font-size="16" text-anchor="middle" style="fill:#4b5563">(average over copies)</text><text x="362" y="186" class="h b" font-size="16" style="fill:#dc2626">60 %</text><rect x="473" y="214" width="210" height="100" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="470" y="210" width="210" height="100" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="478" y="224" width="7" height="72" rx="3.5" fill="#6b7280"/><text x="582" y="252" class="h b" font-size="19" text-anchor="middle">metrics-server</text><text x="582" y="280" class="h" font-size="16" text-anchor="middle" style="fill:#4b5563">(kube-system)</text><text x="575" y="340" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">measures every pod</text><path d="M412 260 Q438 260 464 260" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/><path d="M450.8 252.8 L464 260 M450.8 267.2 L464 260" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="763" y="144" width="410" height="220" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="760" y="140" width="410" height="220" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="768" y="154" width="7" height="192" rx="3.5" fill="#6b7280"/><text x="790" y="178" class="h b" font-size="20">autoscaler (HPA) for the API</text><path d="M800 240 Q800 222 800 204" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/><path d="M792.8 217.2 L800 204 M807.2 217.2 L800 204" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="822" y="214" class="h" font-size="17"><tspan x="822">average CPU over 60 %:</tspan><tspan x="822" dy="22">add up to 2 copies every 30 s,</tspan><tspan x="822" dy="22">at most 8</tspan></text><path d="M800 280 Q800 298 800 316" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/><path d="M807.2 302.8 L800 316 M792.8 302.8 L800 316" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="822" y="298" class="h" font-size="17"><tspan x="822">quiet for 3 minutes:</tspan><tspan x="822" dy="22">remove 1 copy a minute, at least 2</tspan></text><path d="M686 260 Q720 257.5 754 255" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/><path d="M740.3 248.8 L754 255 M741.4 263.1 L754 255" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="43" y="444" width="100" height="80" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="40" y="440" width="100" height="80" rx="16" fill="#fff" stroke="#1f2937" stroke-width="2.6" filter="url(#r)"/><rect x="48" y="454" width="7" height="52" rx="3.5" fill="#7c3aed"/><text x="98" y="476" class="h b" font-size="18" text-anchor="middle">API</text><text x="98" y="502" class="h" font-size="16" text-anchor="middle" style="fill:#4b5563">copy 1</text><rect x="161" y="444" width="100" height="80" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="158" y="440" width="100" height="80" rx="16" fill="#fff" stroke="#1f2937" stroke-width="2.6" filter="url(#r)"/><rect x="166" y="454" width="7" height="52" rx="3.5" fill="#7c3aed"/><text x="216" y="476" class="h b" font-size="18" text-anchor="middle">API</text><text x="216" y="502" class="h" font-size="16" text-anchor="middle" style="fill:#4b5563">copy 2</text><rect x="276" y="440" width="100" height="80" rx="16" fill="#fff" stroke="#1f2937" stroke-width="2.6" stroke-dasharray="7 6" filter="url(#r)"/><rect x="284" y="454" width="7" height="52" rx="3.5" fill="#7c3aed"/><text x="334" y="476" class="h b" font-size="18" text-anchor="middle">API</text><text x="334" y="502" class="h b" font-size="16" text-anchor="middle" style="fill:#16a34a">new</text><rect x="394" y="440" width="100" height="80" rx="16" fill="#fff" stroke="#1f2937" stroke-width="2.6" stroke-dasharray="7 6" filter="url(#r)"/><rect x="402" y="454" width="7" height="52" rx="3.5" fill="#7c3aed"/><text x="452" y="476" class="h b" font-size="18" text-anchor="middle">API</text><text x="452" y="502" class="h b" font-size="16" text-anchor="middle" style="fill:#16a34a">new</text><text x="330" y="426" class="h b" font-size="22" text-anchor="middle" style="fill:#16a34a">+2</text><path d="M965 364 L965 400 L400 400 L400 404" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M407.2 390.8 L400 404 M392.8 390.8 L400 404" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="392" class="h" font-size="17" style="fill:#4b5563">adds pods</text><text x="40" y="552" class="h" font-size="16" style="fill:#4b5563"><tspan x="40">a new copy gets traffic once</tspan><tspan x="40" dy="21">its readiness check passes</tspan><tspan x="40" dy="21">(PostgreSQL and Redis reachable)</tspan></text><rect x="600" y="425" width="260" height="150" rx="10" fill="#fff" stroke="#1f2937" stroke-width="2.6"/><text x="618" y="455" class="m b" font-size="17">api (headless)</text><text x="618" y="479" class="h" font-size="16" style="fill:#4b5563">DNS lists every ready copy:</text><text x="630" y="513" class="m" font-size="15" style="fill:#1f2937">10.1.0.21</text><text x="742" y="513" class="m" font-size="15" style="fill:#1f2937">10.1.0.22</text><text x="630" y="539" class="m b" font-size="15" style="fill:#16a34a">10.1.0.37</text><text x="742" y="539" class="m b" font-size="15" style="fill:#16a34a">10.1.0.38</text><path d="M516 480 Q555 480 594 480" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/><path d="M580.8 472.8 L594 480 M580.8 487.2 L594 480" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="923" y="429" width="250" height="150" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="920" y="425" width="250" height="150" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="928" y="439" width="7" height="122" rx="3.5" fill="#0d9488"/><text x="1055" y="463" class="h b" font-size="21" text-anchor="middle">gateway</text><text x="1055" y="495" class="h" font-size="16" text-anchor="middle"><tspan x="1055">re-reads the list every</tspan><tspan x="1055" dy="21">5 s; each request goes</tspan><tspan x="1055" dy="21">to the least busy copy</tspan></text><path d="M866 480 Q890 480 914 480" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/><path d="M900.8 472.8 L914 480 M900.8 487.2 L914 480" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="40" y1="650" x2="1160" y2="650" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.5"/><rect x="43" y="694" width="360" height="110" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="40" y="690" width="360" height="110" rx="16" fill="#fff" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><rect x="48" y="704" width="7" height="82" rx="3.5" fill="#0d9488"/><text x="70" y="728" class="h b" font-size="18">the gateway scales too:</text><text x="70" y="756" class="h" font-size="17"><tspan x="70">its own HPA, 2–6 copies</tspan><tspan x="70" dy="22">at 70 % CPU</tspan></text><text x="460" y="690" class="h b" font-size="21" style="fill:#dc2626">the database is the ceiling</text><rect x="466" y="712" width="40" height="30" rx="7" fill="#fff" stroke="#7c3aed" stroke-width="2.4"/><text x="486" y="733" class="m" font-size="15" text-anchor="middle">10</text><line x1="486" y1="744" x2="968" y2="752" stroke="#6b7280" stroke-width="1.3" opacity="0.7"/><rect x="518" y="712" width="40" height="30" rx="7" fill="#fff" stroke="#7c3aed" stroke-width="2.4"/><text x="538" y="733" class="m" font-size="15" text-anchor="middle">10</text><line x1="538" y1="744" x2="968" y2="756" stroke="#6b7280" stroke-width="1.3" opacity="0.7"/><rect x="570" y="712" width="40" height="30" rx="7" fill="#fff" stroke="#7c3aed" stroke-width="2.4"/><text x="590" y="733" class="m" font-size="15" text-anchor="middle">10</text><line x1="590" y1="744" x2="968" y2="760" stroke="#6b7280" stroke-width="1.3" opacity="0.7"/><rect x="622" y="712" width="40" height="30" rx="7" fill="#fff" stroke="#7c3aed" stroke-width="2.4"/><text x="642" y="733" class="m" font-size="15" text-anchor="middle">10</text><line x1="642" y1="744" x2="968" y2="764" stroke="#6b7280" stroke-width="1.3" opacity="0.7"/><rect x="674" y="712" width="40" height="30" rx="7" fill="#fff" stroke="#7c3aed" stroke-width="2.4"/><text x="694" y="733" class="m" font-size="15" text-anchor="middle">10</text><line x1="694" y1="744" x2="968" y2="768" stroke="#6b7280" stroke-width="1.3" opacity="0.7"/><rect x="726" y="712" width="40" height="30" rx="7" fill="#fff" stroke="#7c3aed" stroke-width="2.4"/><text x="746" y="733" class="m" font-size="15" text-anchor="middle">10</text><line x1="746" y1="744" x2="968" y2="772" stroke="#6b7280" stroke-width="1.3" opacity="0.7"/><rect x="778" y="712" width="40" height="30" rx="7" fill="#fff" stroke="#7c3aed" stroke-width="2.4"/><text x="798" y="733" class="m" font-size="15" text-anchor="middle">10</text><line x1="798" y1="744" x2="968" y2="776" stroke="#6b7280" stroke-width="1.3" opacity="0.7"/><rect x="830" y="712" width="40" height="30" rx="7" fill="#fff" stroke="#7c3aed" stroke-width="2.4"/><text x="850" y="733" class="m" font-size="15" text-anchor="middle">10</text><line x1="850" y1="744" x2="968" y2="780" stroke="#6b7280" stroke-width="1.3" opacity="0.7"/><path d="M965 705.6 V794.4 A95 15.6 0 0 0 1155 794.4 V705.6 Z" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><ellipse cx="1060" cy="705.6" rx="95" ry="15.6" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><path d="M969 717.6 A91 15.6 0 0 0 1151 717.6" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/><text x="1060" y="768" class="h b" font-size="18" text-anchor="middle">PostgreSQL</text><text x="460" y="812" class="h b" font-size="18">8 copies × 10 database connections = 80;</text><text x="460" y="840" class="h" font-size="17" 