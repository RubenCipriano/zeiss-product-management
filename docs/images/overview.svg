<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="790" viewBox="0 0 1200 790" aria-labelledby="t d"><title id="t">The system at a glance</title><desc id="d">Three kinds of people (viewer, stock clerk, manager) in a browser and the k6 load tests all enter through one door, the nginx gateway. The gateway sends page requests to web (the Angular files) and /api requests to the API (ASP.NET Core, 2 to 8 copies), which uses PostgreSQL (products and the stock ledger) and Redis (cache, rate limits, idempotency keys). The catalogue holds 850,000 products and 5 million stock movements. Teal parts live in the frontend repository, violet parts in the backend repository.</desc><style>.h{font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive;fill:#1f2937}.m{font-family:Menlo,Consolas,monospace;fill:#1f2937}.b{font-weight:700}</style><defs><filter id="r" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="1200" height="790" fill="#fffdf8"/><path d="M34 72 Q271 67 508 70" stroke="#fde68a" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.95"/><text x="40" y="66" class="h b" font-size="42">The system at a glance</text><text x="40" y="106" class="h" font-size="20" style="fill:#4b5563">one door in, two repositories behind it</text><text x="40" y="160" class="h b" font-size="20" style="fill:#4b5563">who uses it</text><path d="M61 251 Q60 222 78 221 Q96 222 95 251 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="2.5" stroke-linejoin="round"/><circle cx="78" cy="205" r="11" fill="#a78bfa" stroke="#6d28d9" stroke-width="2.5"/><text x="108" y="231" class="h" font-size="20">viewer</text><path d="M236 223 Q287.8 292.3 326 370" fill="none" stroke="#6d28d9" stroke-width="2.6" stroke-linecap="round"/><path d="M326.6 355 L326 370 M3