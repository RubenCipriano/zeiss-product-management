<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="900" viewBox="0 0 1200 900" aria-labelledby="t d"><title id="t">A retried request is applied once, whichever copy gets it</title><desc id="d">A user double-clicks, or a client retries after a timeout: both requests carry the same Idempotency-Key K and may reach different API copies. Each copy asks Redis to SET the key only if it does not exist (NX). The first one wins and runs the stock change once in PostgreSQL; the answer is kept in Redis for an hour. The other copy answers 409 while the first is still running, or later replays the stored answer with the header Idempotent-Replayed: true. Backstop: the ledger row carries the request key under a UNIQUE index, so a second execution is impossible even if Redis forgot; the stock change is rolled back with it. The load test found about 500 duplicates in 52,000 changes under overload before this backstop; now 0.</desc><style>.h{font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive;fill:#1f2937}.m{font-family:Menlo,Consolas,monospace;fill:#1f2937}.b{font-weight:700}</style><defs><filter id="r" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="1200" height="900" fill="#fffdf8"/><path d="M34 72 Q418 67 802 70" stroke="#fde68a" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.95"/><text x="40" y="66" class="h b" font-size="42">Applied once, whichever copy gets it</text><text x="40" y="106" class="h" font-size="20" style="fill:#4b5563">a double click or a retry after a timeout carries the same Idempotency-Key (K)</text><path d="M74.6 260.2 Q73.4 225.4 95 224.2 Q116.6 225.4 115.4 260.2 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round"/><circle cx="95" cy="205" r="13.2" fill="#a78bfa" stroke="#6d28d9" stroke-width="3"/><text x="95" y="290" class="h" font-size="18" text-anchor="middle">double click</text><rect x="132" y="215" width="26" height="38" rx="13" fill="#fff" stroke="#1f2937" stroke-width="2.2"/><line x1="145" y1="215" x2="145" y2="230" stroke="#1f2937" stroke-width="2"/><line x1="95" y1="405" x2="95" y2="395" stroke="#4b5563" stroke-width="2.5"/><circle cx="95" cy="392" r="4" fill="#f97316" stroke="#4b5563" stroke-width="2"/><rect x="76" y="405" width="38" height="29" rx="7" fill="#e5e7eb" stroke="#4b5563" stroke-width="2.5"/><circle cx="87" cy="417" r="4" fill="#4b5563"/><circle cx="103" cy="417" r="4" fill="#4b5563"/><line x1="88" y1="427" x2="102" y2="427" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/><rect x="72" y="438" width="46" height="30" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="2.5"/><circle cx="95" cy="453" r="5" fill="#fff" stroke="#4b5563" stroke-width="2"/><text x="95" y="500" class="h" font-size="18" text-anchor="middle"><tspan x="95">retry after</tspan><tspan x="95" dy="22">a timeout</tspan></text><rect x="333" y="154" width="200" height="100" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="330" y="150" width="200" height="100" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="338" y="164" width="7" height="72" rx="3.5" fill="#7c3aed"/><text x="438" y="194" class="h b" font-size="22" text-anchor="middle">API</text><text x="438" y="224" class="h" font-size="18" text-anchor="middle" style="fill:#4b5563">copy 1</text><rect x="333" y="404" width="200" height="100" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="330" y="400" width="200" height="100" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="338" y="414" width="7" height="72" rx="3.5" fill="#7c3aed"/><text x="438" y="444" class="h b" font-size="22" text-anchor="middle">API</text><text x="438" y="474" class="h" font-size="18" text-anchor="middle" style="fill:#4b5563">copy 2</text><path d="M170 222 Q246.2 205.1 324 200" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/><path d="M310.4 193.7 L324 200 M311.3 208 L324 200" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="245" cy="204" r="11" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><text x="245" y="209.5" class="h b" font-size="15" text-anchor="middle" style="fill:#fff">K</text><path d="M170 240 Q239.2 341.3 324 430" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/><path d="M320.1 415.5 L324 430 M309.7 425.5 L324 430" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="330" r="11" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><text x="240" y="335.5" class="h b" font-size="15" text-anchor="middle" style="fill:#fff">K</text><path d="M140 440 Q232 452.5 324 465" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M311.9 456.1 L324 465 M310 470.4 L324 465" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="232" cy="452" r="11" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><text x="232" y="457.5" class="h b" font-size="15" text-anchor="middle" style="fill:#fff">K</text><rect x="653" y="266" width="250" height="140" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="650" y="262" width="250" height="140" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="658" y="276" width="7" height="112" rx="3.5" fill="#7c3aed"/><path d="M695.2 286 L684 304.4 L692 304.4 L688.8 318 L700 298.8 L692 298.8 L695.2 286 Z" fill="#facc15" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/><text x="790" y="306" class="h b" font-size="22" text-anchor="middle">Redis</text><text x="785" y="340" class="m" font-size="17" text-anchor="middle">SET K NX</text><text x="785" y="366" class="h" font-size="17" text-anchor="middle">first one wins;</text><text x="785" y="389" class="h" font-size="17" text-anchor="middle">answer kept 1 h</text><path d="M536 230 Q593.3 261 644 302" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><path d="M638.3 288.1 L644 302 M629.2 299.3 L644 302" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="578" y="270" class="h b" font-size="17" text-anchor="middle" style="fill:#16a34a">OK</text><path d="M536 420 Q592.4 401.5 644 372" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><path d="M629 372.3 L644 372 M636.1 384.8 L644 372" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="382" class="h b" font-size="17" text-anchor="middle" style="fill:#dc2626">taken</text><path d="M990 146.9 V243.1 A85 16.9 0 0 0 1160 243.1 V146.9 Z" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><ellipse cx="1075" cy="146.9" rx="85" ry="16.9" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><path d="M994 158.9 A81 16.9 0 0 0 1156 158.9" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/><text x="1075" y="222" class="h b" font-size="18" text-anchor="middle">PostgreSQL</text><path d="M536 175 Q760.1 178.5 984 190" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><path d="M971.2 182.1 L984 190 M970.5 196.5 L984 190" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="760.1" cy="180.5" r="7" fill="#f97316" stroke="#1f2937" stroke-width="1.6"/><text x="760" y="166" class="h" font-size="17" text-anchor="middle">copy 1 runs the change, once</text><path d="M775 408 Q775 431 775 454" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/><path d="M782.2 440.8 L775 454 M767.8 440.8 L775 454" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="653" y="464" width="520" height="146" rx="14" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="650" y="460" width="520" height="146" rx="14" fill="#fff" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><text x="670" y="494" class="h b" font-size="18">so copy 2 answers:</text><text x="670" y="526" class="h b" font-size="17" style="fill:#f97316">first still running → 409 in progress</text><text x="670" y="556" class="h b" font-size="17" style="fill:#16a34a">already done → the same answer again,</text><text x="670" y="584" class="h" font-size="16" style="fill:#4b5563">with header <tspan class="m">Idempotent-Replayed: true</tspan></text><line x1="40" y1="640" x2="1160" y2="640" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.5"/><path d="M48 675 V669 A8 8 0 0 1 64 669 V675" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><rect x="43" y="675" width="26" height="20" rx="4" fill="#fbbf24" stroke="#1f2937" stroke-width="2.4"/><circle cx="56" cy="684" r="2.6" fill="#1f2937"/><text x="80" y="692" class="h b" font-size="22">Backstop, in PostgreSQL: the stock ledger</text><rect x="40" y="720" width="620" height="150" rx="10" fill="#fff" stroke="#1f2937" stroke-width="2.4"/><text x="60" y="752" class="m b" font-size="16">product</text><text x="180" y="752" class="m b" font-size="16">change</text><text x="290" y="752" class="m b" font-size="16">request_key  UNIQUE</text><line x1="52" y1="764" x2="648" y2="764" stroke="#1f2937" stroke-width="1.6"/><text x="60" y="798" class="m" font-size="16">123456</text><text x="180" y="798" class="m" font-size="16">-1</text><text x="290" y="798" class="m" font-size="16">clerk-1:K</text><path d="M452.8 792 L458.4 798.4 L468.8 784.8" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="838" class="m" font-size="16" opacity="0.5">123456</text><text x="180" y="838" class="m" font-size="16" opacity="0.5">-1</text><text x="290" y="838" class="m" font-size="16" opacity="0.5">clerk-1:K</text><path d="M453.6 825.6 L466.4 838.4 M466.4 825.6 L453.6 838.4" stroke="#dc2626" stroke-width="3.2" stroke-linecap="round"/><line x1="54" y1="832" x2="440" y2="832" stroke="#dc2626" stroke-width="2.4"/><text x="486" y="838" class="h b" font-size="16" style="fill:#dc2626">refused,</text><text x="486" y="860" class="h b" font-size="16" style="fill:#dc2626">rolled back</text><g transform="rotate(0.8 930 790)"><rect x="700" y="715" width="460" height="150" rx="6" fill="#fff7cc" stroke="#1f2937" stroke-width="2" filter="url(#r)"/><rect x="896" y="706" width="68" height="18" rx="3" fill="#d1d5db" opacity="0.8"/></g><text x="930" y="750" class="h" font-size="17" text-anchor="middle"><tspan x="930">even if Redis forgot the key, a second</tspan><tspan x="930" dy="23">ledger row with the same key is refused,</tspan><tspan x="930" dy="23">and the stock change goes with it</tspan></text><text x="930" y="834" class="h b" font-size="18" text-anchor="middle" style="fill:#16a34a">~500 duplicates in 52,000 → now 0</text><text x="930" y="856" class="h" font-size="15" text-anchor="middle" style="fill:#4b5563">(found by the load test, under overload)</text></svg>