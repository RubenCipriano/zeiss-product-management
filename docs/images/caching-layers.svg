<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="790" viewBox="0 0 1200 790" aria-labelledby="t d"><title id="t">Four layers, each answers what it can</title><desc id="d">Four boxes from left to right, with only misses going on to the next. Browser cache: key is the URL; fresh for 5 seconds means no request at all; up to 5 minutes the copy is shown at once and refreshed behind; emptied on sign-out and after any change the user makes. nginx microcache: key is method, URL and roles; lives 1 second; concurrent misses wait for one request; skipped right after your own change. API plus Redis: product details until that product changes (at most 5 minutes); list counts and page ids until the catalogue changes (at most 10 minutes); the rows are always read fresh; one query per key at a time (single-flight). PostgreSQL: the source of truth; it gets the misses, the 20 rows of every list page and every write.</desc><style>.h{font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive;fill:#1f2937}.m{font-family:Menlo,Consolas,monospace;fill:#1f2937}.b{font-weight:700}</style><defs><filter id="r" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="1200" height="790" fill="#fffdf8"/><path d="M34 72 Q428.5 67 823 70" stroke="#fde68a" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.95"/><text x="40" y="66" class="h b" font-size="42">Four layers, each answers what it can</text><text x="40" y="106" class="h" font-size="20" style="fill:#4b5563">a request walks left to right; only misses go on</text><rect x="43" y="166" width="240" height="100" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="40" y="162" width="240" height="100" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="48" y="176" width="7" height="72" rx="3.5" fill="#0d9488"/><rect x="70" y="192" width="50" height="38" rx="6" fill="#fff" stroke="#1f2937" stroke-width="2.4"/><path d="M70 204 H120" stroke="#1f2937" stroke-width="2.4"/><circle cx="77" cy="198" r="2.3" fill="#0d9488"/><circle cx="84" cy="198" r="2.3" fill="#0d9488"/><circle cx="91" cy="198" r="2.3" fill="#0d9488"/><text x="185" y="208" class="h b" font-size="22" text-anchor="middle">browser</text><text x="185" y="236" class="h" font-size="19" text-anchor="middle">cache</text><rect x="336" y="166" width="240" height="100" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="333" y="162" width="240" height="100" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="341" y="176" width="7" height="72" rx="3.5" fill="#0d9488"/><rect x="361" y="184" width="34" height="54" rx="4" fill="#ccfbf1" stroke="#1f2937" stroke-width="2.4"/><rect x="367" y="191" width="22" height="18.9" rx="2" fill="none" stroke="#0d9488" stroke-width="2"/><circle cx="386" cy="215.3" r="3" fill="#1f2937"/><text x="468" y="208" class="h b" font-size="22" text-anchor="middle">nginx</text><text x="468" y="236" class="h" font-size="19" text-anchor="middle">microcache</text><rect x="630" y="166" width="240" height="100" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="627" y="162" width="240" height="100" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="635" y="176" width="7" height="72" rx="3.5" fill="#7c3aed"/><path d="M681 192 L667 215 L677 215 L673 232 L687 208 L677 208 L681 192 Z" fill="#facc15" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/><text x="767" y="208" class="h b" font-size="22" text-anchor="middle">API</text><text x="767" y="236" class="h" font-size="19" text-anchor="middle">+ Redis</text><path d="M920 172 V252 A120 14 0 0 0 1160 252 V172 Z" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><ellipse cx="1040" cy="172" rx="120" ry="14" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><path d="M924 184 A116 14 0 0 0 1156 184" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/><text x="1040" y="232" class="h b" font-size="22" text-anchor="middle">PostgreSQL</text><path d="M286 224 Q305.5 224 325 224" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><path d="M311.8 216.8 L325 224 M311.8 231.2 L325 224" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="305.5" cy="224" r="6" fill="#f97316" stroke="#1f2937" stroke-width="1.6"/><text x="305.5" y="150" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">only misses go on</text><path d="M579 224 Q599 224 619 224" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><path d="M605.8 216.8 L619 224 M605.8 231.2 L619 224" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="599" cy="224" r="6" fill="#f97316" stroke="#1f2937" stroke-width="1.6"/><text x="599" y="150" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">only misses go on</text><path d="M873 224 Q892.5 224 912 224" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><path d="M898.8 216.8 L912 224 M898.8 231.2 L912 224" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="892.5" cy="224" r="6" fill="#f97316" stroke="#1f2937" stroke-width="1.6"/><text x="892.5" y="150" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563">only misses go on</text><rect x="43" y="304" width="240" height="403" rx="14" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="40" y="300" width="240" height="403" rx="14" fill="#fff" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><g stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"><path d="M59.8 328.3 H74.5 V331.7 H72.8 V335 H70.3 V331.7 H68.6 V334.2 H66.5 V331.7 H59.8 Z" fill="#f59e0b"/><circle cx="56" cy="330" r="5" fill="#f59e0b"/><circle cx="54.7" cy="330" r="1.7" fill="#fff"/></g><text x="86" y="336" class="h" font-size="17"><tspan x="86">key:</tspan><tspan x="86" dy="23"><tspan class="m">the URL</tspan></tspan></text><circle cx="66" cy="392" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.4"/><path d="M66 385.2 V392 L71.5 395.3" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="398" class="h" font-size="17"><tspan x="86">fresh 5 s:</tspan><tspan x="86" dy="23">no request at all</tspan></text><circle cx="66" cy="454" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.4"/><path d="M66 447.2 V454 L71.5 457.3" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="460" class="h" font-size="17"><tspan x="86">up to 5 min:</tspan><tspan x="86" dy="23">shown now,</tspan><tspan x="86" dy="23">refreshed behind</tspan></text><path d="M57 532 H75 L73 550 H59 Z" fill="#fff" stroke="#1f2937" stroke-width="2.2"/><path d="M55 531 H77 M62 528 H70" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/><text x="86" y="545" class="h" font-size="17"><tspan x="86">emptied on sign-out</tspan><tspan x="86" dy="23">and after any change</tspan><tspan x="86" dy="23">you make</tspan></text><line x1="160.0" y1="266" x2="160.0" y2="298" stroke="#1f2937" stroke-width="2" stroke-dasharray="3 5"/><rect x="336" y="304" width="240" height="403" rx="14" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="333" y="300" width="240" height="403" rx="14" fill="#fff" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><g stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"><path d="M352.8 328.3 H367.5 V331.7 H365.8 V335 H363.3 V331.7 H361.6 V334.2 H359.5 V331.7 H352.8 Z" fill="#f59e0b"/><circle cx="349" cy="330" r="5" fill="#f59e0b"/><circle cx="347.7" cy="330" r="1.7" fill="#fff"/></g><text x="379" y="336" class="h" font-size="17"><tspan x="379">key:</tspan><tspan x="379" dy="23"><tspan class="m">method + URL</tspan></tspan><tspan x="379" dy="23"><tspan class="m">+ roles</tspan></tspan></text><circle cx="359" cy="415" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.4"/><path d="M359 408.2 V415 L364.5 418.3" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="379" y="421" class="h" font-size="17"><tspan x="379">lives 1 s,</tspan><tspan x="379" dy="23">shared by everyone</tspan><tspan x="379" dy="23">with the same roles</tspan></text><circle cx="350" cy="500" r="4.5" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><circle cx="359" cy="500" r="4.5" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><circle cx="368" cy="500" r="4.5" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><text x="379" y="506" class="h" font-size="17"><tspan x="379">misses at once:</tspan><tspan x="379" dy="23">one asks,</tspan><tspan x="379" dy="23">the others wait</tspan></text><path d="M350 578 H368 L366 596 H352 Z" fill="#fff" stroke="#1f2937" stroke-width="2.2"/><path d="M348 577 H370 M355 574 H363" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/><text x="379" y="591" class="h" font-size="17"><tspan x="379">skipped right after</tspan><tspan x="379" dy="23">your own change</tspan></text><line x1="453.0" y1="266" x2="453.0" y2="298" stroke="#1f2937" stroke-width="2" stroke-dasharray="3 5"/><rect x="630" y="304" width="240" height="403" rx="14" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="627" y="300" width="240" height="403" rx="14" fill="#fff" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><g stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"><path d="M646.8 328.3 H661.5 V331.7 H659.8 V335 H657.3 V331.7 H655.6 V334.2 H653.5 V331.7 H646.8 Z" fill="#f59e0b"/><circle cx="643" cy="330" r="5" fill="#f59e0b"/><circle cx="641.7" cy="330" r="1.7" fill="#fff"/></g><text x="673" y="336" class="h" font-size="17"><tspan x="673">key: generations</tspan><tspan x="673" dy="23">+ what is cached</tspan></text><circle cx="653" cy="392" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.4"/><path d="M653 385.2 V392 L658.5 395.3" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="673" y="398" class="h" font-size="17"><tspan x="673">product details:</tspan><tspan x="673" dy="23">until it changes</tspan><tspan x="673" dy="23">(≤ 5 min)</tspan></text><circle cx="653" cy="477" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.4"/><path d="M653 470.2 V477 L658.5 480.3" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="673" y="483" class="h" font-size="17"><tspan x="673">list counts + ids:</tspan><tspan x="673" dy="23">until the catalogue</tspan><tspan x="673" dy="23">changes (≤ 10 min)</tspan></text><path d="M645.8 562 L651.4 568.4 L661.8 554.8" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="673" y="568" class="h" font-size="17"><tspan x="673">rows: always</tspan><tspan x="673" dy="23">read fresh by id</tspan></text><circle cx="653" cy="624" r="11" fill="#fff" stroke="#1f2937" stroke-width="2.2"/><text x="653" y="630" class="h b" font-size="16" text-anchor="middle">1</text><text x="673" y="630" class="h" font-size="17"><tspan x="673">one query per key</tspan><tspan x="673" dy="23">at a time</tspan><tspan x="673" dy="23">(single-flight)</tspan></text><line x1="747.0" y1="266" x2="747.0" y2="298" stroke="#1f2937" stroke-width="2" stroke-dasharray="3 5"/><rect x="923" y="304" width="240" height="403" rx="14" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="920" y="300" width="240" height="403" rx="14" fill="#fff" stroke="#1f2937" stroke-width="2.4" filter="url(#r)"/><path d="M938.8 330 L944.4 336.4 L954.8 322.8" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="966" y="336" class="h" font-size="17">the source of truth</text><circle cx="946" cy="368" r="6" fill="#f97316" stroke="#1f2937" stroke-width="1.6"/><text x="966" y="375" class="h" font-size="17"><tspan x="966">everything not</tspan><tspan x="966" dy="23">answered above</tspan></text><circle cx="946" cy="430" r="6" fill="#f97316" stroke="#1f2937" stroke-width="1.6"/><text x="966" y="437" class="h" font-size="17"><tspan x="966">the 20 rows of</tspan><tspan x="966" dy="23">every list page</tspan></text><circle cx="946" cy="492" r="6" fill="#f97316" stroke="#1f2937" stroke-width="1.6"/><text x="966" y="499" class="h" font-size="17">every write</text><line x1="1040.0" y1="266" x2="1040.0" y2="298" stroke="#1f2937" stroke-width="2" stroke-dasharray="3 5"/><text x="600" y="753" class="h" font-size="19" text-anchor="middle" style="fill:#4b5563">A hit at any layer answers from there; the layers to its right never see the request.</text></svg>