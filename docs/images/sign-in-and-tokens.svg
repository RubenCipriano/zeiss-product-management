<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="900" viewBox="0 0 1200 900" aria-labelledby="t d"><title id="t">Who can sign, who can only check</title><desc id="d">Step 1, sign in: a user sends a client id and secret to POST /api/auth/token. The API checks the secret against a PBKDF2 hash (only the hash is stored); 10 failed sign-ins per minute from one IP are blocked, counted in Redis so every API copy agrees. The API holds the private key and signs an ES256 token whose header has alg and kid and whose payload has sub, roles, issuer, audience and expiry. Step 2, every request: the gateway downloads the public key from /.well-known/jwks.json and checks every token (signature, issuer, audience, expiry). A bad token gets 401 at the door; a good one has known roles, so the 1-second cache is shared per role. The API checks the token again (defence in depth) and then the permissions.</desc><style>.h{font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive;fill:#1f2937}.m{font-family:Menlo,Consolas,monospace;fill:#1f2937}.b{font-weight:700}</style><defs><filter id="r" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="1200" height="900" fill="#fffdf8"/><path d="M34 72 Q376 67 718 70" stroke="#fde68a" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.95"/><text x="40" y="66" class="h b" font-size="42">Who can sign, who can only check</text><text x="40" y="106" class="h" font-size="20" style="fill:#4b5563">one private key in the API; everyone else gets the public key</text><circle cx="52" cy="150" r="16" fill="#1f2937"/><text x="52" y="156.7" class="h b" font-size="19" text-anchor="middle" style="fill:#fff">1</text><text x="78" y="157" class="h b" font-size="22">sign in</text><path d="M74.6 300.2 Q73.4 265.4 95 264.2 Q116.6 265.4 115.4 300.2 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round"/><circle cx="95" cy="245" r="13.2" fill="#a78bfa" stroke="#6d28d9" stroke-width="3"/><text x="95" y="325" class="h" font-size="18" text-anchor="middle">a user</text><path d="M140 268 Q233 268 326 268" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><path d="M312.8 260.8 L326 268 M312.8 275.2 L326 268" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="233" cy="268" r="7" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><text x="233" y="250" class="h" font-size="17" text-anchor="middle">client id + secret</text><rect x="333" y="184" width="418" height="250" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="330" y="180" width="418" height="250" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="338" y="194" width="7" height="222" rx="3.5" fill="#7c3aed"/><text x="362" y="220" class="h b" font-size="26">API</text><text x="362" y="252" class="m" font-size="16">POST /api/auth/token</text><path d="M366.8 285 L372.4 291.4 L382.8 277.8" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="392" y="292" class="h" font-size="17"><tspan x="392">secret checked against</tspan><tspan x="392" dy="23">a PBKDF2 hash (only</tspan><tspan x="392" dy="23">the hash is stored)</tspan></text><path d="M366.8 376 L372.4 382.4 L382.8 368.8" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="392" y="383" class="h" font-size="17"><tspan x="392">signs a token</tspan><tspan x="392" dy="23">with ES256</tspan></text><rect x="616" y="250" width="118" height="160" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><g stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"><path d="M658.4 293.4 H698.6 V302.6 H694 V311.8 H687.1 V302.6 H682.5 V309.5 H676.8 V302.6 H658.4 Z" fill="#f59e0b"/><circle cx="648" cy="298" r="13.8" fill="#f59e0b"/><circle cx="644.5" cy="298" r="4.6" fill="#fff"/></g><path d="M640.8 321.9 V316.5 A7.2 7.2 0 0 1 655.2 316.5 V321.9" fill="none" stroke="#1f2937" stroke-width="2.7" stroke-linecap="round"/><rect x="636.3" y="321.9" width="23.4" height="18" rx="3.6" fill="#f87171" stroke="#1f2937" stroke-width="2.4"/><circle cx="648" cy="330" r="2.3" fill="#1f2937"/><text x="675" y="374" class="h b" font-size="17" text-anchor="middle" style="fill:#dc2626">PRIVATE</text><text x="675" y="396" class="h b" font-size="17" text-anchor="middle" style="fill:#dc2626">key</text><g transform="rotate(-1 167.5 411)"><rect x="40" y="355" width="255" height="112" rx="6" fill="#fff7cc" stroke="#1f2937" stroke-width="2" filter="url(#r)"/><rect x="133.5" y="346" width="68" height="18" rx="3" fill="#d1d5db" opacity="0.8"/></g><text x="167" y="386" class="h" font-size="17" text-anchor="middle"><tspan x="167">10 failures a minute</tspan><tspan x="167" dy="22">from one IP: blocked</tspan><tspan x="167" dy="22">(counted in Redis, so</tspan><tspan x="167" dy="22">all API copies agree)</tspan></text><path d="M754 300 Q780.5 300 807 300" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><path d="M793.8 292.8 L807 300 M793.8 307.2 L807 300" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="780.5" cy="300" r="7" fill="#16a34a" stroke="#1f2937" stroke-width="1.6"/><text x="781.5" y="288" class="h b" font-size="17" text-anchor="middle" style="fill:#16a34a">token</text><rect x="815" y="175" width="355" height="290" rx="10" fill="#fff" stroke="#1f2937" stroke-width="2.6"/><text x="833" y="209" class="h b" font-size="20">the token (a JWT)</text><text x="833" y="239" class="h" font-size="16" style="fill:#4b5563">header</text><text x="911" y="239" class="m" font-size="15"><tspan x="911">{ "alg": "ES256",</tspan><tspan x="911" dy="22">  "kid": "…" }</tspan></text><text x="833" y="293" class="h" font-size="16" style="fill:#4b5563">payload</text><text x="911" y="293" class="m" font-size="15"><tspan x="911">{ "sub": "&lt;client id&gt;",</tspan><tspan x="911" dy="22">  "roles": ["stock-clerk"],</tspan><tspan x="911" dy="22">  "iss": "…", "aud": "…",</tspan><tspan x="911" dy="22">  "exp": … }</tspan></text><line x1="833" y1="393" x2="1152" y2="393" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 4"/><text x="833" y="423" class="h" font-size="16" style="fill:#4b5563">signature: made with the private key</text><text x="833" y="447" class="h" font-size="16" style="fill:#4b5563">the browser can read it, not forge it</text><line x1="40" y1="492" x2="1160" y2="492" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.5"/><circle cx="52" cy="535" r="16" fill="#1f2937"/><text x="52" y="541.7" class="h b" font-size="19" text-anchor="middle" style="fill:#fff">2</text><text x="78" y="542" class="h b" font-size="22">every request</text><path d="M74.6 680.2 Q73.4 645.4 95 644.2 Q116.6 645.4 115.4 680.2 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round"/><circle cx="95" cy="625" r="13.2" fill="#a78bfa" stroke="#6d28d9" stroke-width="3"/><text x="95" y="705" class="h" font-size="18" text-anchor="middle">a user</text><rect x="58" y="718" width="74" height="26" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="95" y="736" class="m" font-size="15" text-anchor="middle">token</text><path d="M140 650 Q233 650 326 650" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><path d="M312.8 642.8 L326 650 M312.8 657.2 L326 650" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="233" cy="650" r="7" fill="#a78bfa" stroke="#1f2937" stroke-width="1.6"/><text x="233" y="632" class="h" font-size="17" text-anchor="middle">request + token</text><rect x="333" y="574" width="380" height="230" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="330" y="570" width="380" height="230" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="338" y="584" width="7" height="202" rx="3.5" fill="#0d9488"/><text x="362" y="608" class="h b" font-size="23">gateway (nginx)</text><text x="362" y="644" class="h" font-size="17"><tspan x="362">checks every token:</tspan><tspan x="362" dy="23">signature, issuer,</tspan><tspan x="362" dy="23">audience, expiry</tspan></text><text x="362" y="728" class="h" font-size="17" style="fill:#16a34a"><tspan x="362">good: roles known,</tspan><tspan x="362" dy="23">1 s cache shared</tspan><tspan x="362" dy="23">per role</tspan></text><rect x="580" y="632" width="118" height="136" rx="12" fill="#ccfbf1" stroke="#1f2937" stroke-width="2"/><g stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"><path d="M622.4 669.4 H662.6 V678.6 H658 V687.8 H651.1 V678.6 H646.5 V685.5 H640.8 V678.6 H622.4 Z" fill="#5eead4"/><circle cx="612" cy="674" r="13.8" fill="#5eead4"/><circle cx="608.5" cy="674" r="4.6" fill="#fff"/></g><text x="639" y="722" class="h b" font-size="17" text-anchor="middle" style="fill:#0d9488">PUBLIC</text><text x="639" y="745" class="h b" font-size="17" text-anchor="middle" style="fill:#0d9488">key</text><path d="M675 434 Q657 499 639 564" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><path d="M649.4 553.2 L639 564 M635.6 549.4 L639 564" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="693" y="518" class="h" font-size="16" style="fill:#0d9488">public key, downloaded from</text><text x="693" y="540" class="m" font-size="15" style="fill:#0d9488">/.well-known/jwks.json</text><path d="M450 804 Q450 825 450 846" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><path d="M457.2 832.8 L450 846 M442.8 832.8 L450 846" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M469.6 855.6 L482.4 868.4 M482.4 855.6 L469.6 868.4" stroke="#dc2626" stroke-width="3.2" stroke-linecap="round"/><text x="496" y="869" class="h b" font-size="19" style="fill:#dc2626">bad token: 401 at the door</text><path d="M716 690 Q774 690 832 690" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><path d="M818.8 682.8 L832 690 M818.8 697.2 L832 690" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="774" cy="690" r="7" fill="#f97316" stroke="#1f2937" stroke-width="1.6"/><rect x="843" y="604" width="330" height="170" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="840" y="600" width="330" height="170" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="848" y="614" width="7" height="142" rx="3.5" fill="#7c3aed"/><text x="870" y="640" class="h b" font-size="24">API</text><text x="870" y="678" class="h" font-size="17"><tspan x="870">checks the token again</tspan><tspan x="870" dy="23">(defence in depth),</tspan><tspan x="870" dy="23">then the permissions</tspan></text></svg>