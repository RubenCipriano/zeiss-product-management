<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="790" viewBox="0 0 1200 790" aria-labelledby="t d"><title id="t">How we know it works</title><desc id="d">A pyramid of automated tests. Bottom, unit tests: 212 in the backend (one project, folders Core 116, Infrastructure 31, Api 65) and 187 in the frontend. Middle: 153 integration tests against real PostgreSQL and Redis in containers, plus 16 BDD scenarios. Top: 22 end-to-end runs with Playwright on desktop and phone. Beside the pyramid, three instruments: k6 load tests with 8 scenarios; Lighthouse with Accessibility 100, Best Practices 100 and Performance 97 to 100; and a PDF check that verifies 14 of 14 requirements against the running system.</desc><style>.h{font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive;fill:#1f2937}.m{font-family:Menlo,Consolas,monospace;fill:#1f2937}.b{font-weight:700}</style><defs><filter id="r" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="1200" height="790" fill="#fffdf8"/><path d="M34 72 Q250 67 466 70" stroke="#fde68a" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.95"/><text x="40" y="66" class="h b" font-size="42">How we know it works</text><text x="40" y="106" class="h" font-size="20" style="fill:#4b5563">a pyramid of automated tests, and three instruments beside it</text><rect x="223" y="154" width="300" height="140" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="220" y="150" width="300" height="140" rx="16" fill="#ede9fe" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><text x="370" y="192" class="h b" font-size="22" text-anchor="middle">End-to-end · 22</text><text x="370" y="224" class="h" font-size="17" text-anchor="middle"><tspan x="370">Playwright,</tspan><tspan x="370" dy="23">desktop + phone</tspan></text><rect x="133" y="304" width="480" height="170" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="130" y="300" width="480" height="170" rx="16" fill="#f5f3ff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><text x="370" y="342" class="h b" font-size="22" text-anchor="middle">Integration · 153</text><text x="370" y="374" class="h" font-size="17" text-anchor="middle"><tspan x="370">real PostgreSQL + Redis</tspan><tspan x="370" dy="23">in containers</tspan></text><text x="370" y="446" class="h b" font-size="19" text-anchor="middle" style="fill:#7c3aed">+ BDD · 16 scenarios</text><rect x="43" y="484" width="660" height="220" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="40" y="480" width="660" height="220" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><text x="370" y="522" class="h b" font-size="22" text-anchor="middle">Unit tests · 397</text><text x="370" y="566" class="h b" font-size="19" text-anchor="middle" style="fill:#7c3aed">212 backend</text><text x="370" y="596" class="h" font-size="17" text-anchor="middle">Core 116 · Infrastructure 31 · Api 65</text><text x="370" y="656" class="h b" font-size="19" text-anchor="middle" style="fill:#0d9488">187 frontend</text><text x="370" y="740" class="h" font-size="17" text-anchor="middle" style="fill:#4b5563"><tspan x="370">fast and many at the bottom; slower and fewer,</tspan><tspan x="370" dy="22">but closest to real use, at the top</tspan></text><rect x="773" y="154" width="400" height="175" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="770" y="150" width="400" height="175" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><line x1="820" y1="200.8" x2="820" y2="191.2" stroke="#4b5563" stroke-width="2.4"/><circle cx="820" cy="188.4" r="3.8" fill="#f97316" stroke="#4b5563" stroke-width="2"/><rect x="802" y="200.8" width="36.1" height="27.5" rx="6.6" fill="#e5e7eb" stroke="#4b5563" stroke-width="2.4"/><circle cx="812.4" cy="212.2" r="3.8" fill="#4b5563"/><circle cx="827.6" cy="212.2" r="3.8" fill="#4b5563"/><line x1="813.4" y1="221.7" x2="826.6" y2="221.7" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/><rect x="798.1" y="232.1" width="43.7" height="28.5" rx="7.6" fill="#e5e7eb" stroke="#4b5563" stroke-width="2.4"/><circle cx="820" cy="246.3" r="4.8" fill="#fff" stroke="#4b5563" stroke-width="2"/><text x="870" y="190" class="h b" font-size="21">Load tests: k6</text><text x="870" y="218" class="h b" font-size="18" style="fill:#f97316">8 scenarios</text><text x="870" y="250" class="h" font-size="16"><tspan x="870">smoke, load, stress, spike,</tspan><tspan x="870" dy="21">stock-consistency, rate-limit,</tspan><tspan x="870" dy="21">browse, teams</tspan></text><rect x="773" y="349" width="400" height="185" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="770" y="345" width="400" height="185" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><path d="M790 446 L850 446" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><path d="M804 446 L810 384 H830 L836 446 Z" fill="#fff" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/><path d="M805.7 428 H834.3 L833.2 416 H806.8 Z" fill="#dc2626"/><path d="M808 404 H832 L831 394 H809 Z" fill="#dc2626"/><rect x="808" y="368" width="24" height="16" rx="3" fill="#fde047" stroke="#1f2937" stroke-width="2.2"/><path d="M811 368 L820 358 L829 368" fill="#1f2937" stroke="#1f2937" stroke-width="2"/><path d="M836 372 L858 364 M836 378 L858 380 M804 372 L782 364 M804 378 L782 380" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round"/><text x="870" y="385" class="h b" font-size="21">Lighthouse</text><text x="870" y="420" class="h" font-size="17">Accessibility</text><rect x="1032" y="400" width="52" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1058" y="420" class="h b" font-size="16" text-anchor="middle" style="fill:#16a34a">100</text><text x="870" y="454" class="h" font-size="17">Best Practices</text><rect x="1032" y="434" width="52" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1058" y="454" class="h b" font-size="16" text-anchor="middle" style="fill:#16a34a">100</text><text x="870" y="488" class="h" font-size="17">Performance</text><rect x="1032" y="468" width="80" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1072" y="488" class="h b" font-size="16" text-anchor="middle" style="fill:#16a34a">97–100</text><rect x="773" y="554" width="400" height="150" rx="16" fill="none" stroke="#1f2937" stroke-width="1.6" opacity="0.22"/><rect x="770" y="550" width="400" height="150" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3" filter="url(#r)"/><rect x="794" y="590" width="52" height="66" rx="7" fill="#fff" stroke="#1f2937" stroke-width="2.4"/><rect x="809" y="584" width="22" height="12" rx="4" fill="#d1d5db" stroke="#1f2937" stroke-width="2"/><path d="M804.5 610 L808 614 L814.5 605.5" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="819" y1="610" x2="837" y2="610" stroke="#1f2937" stroke-width="2"/><path d="M804.5 627 L808 631 L814.5 622.5" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="819" y1="627" x2="837" y2="627" stroke="#1f2937" stroke-width="2"/><path d="M804.5 644 L808 648 L814.5 639.5" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="819" y1="644" x2="837" y2="644" stroke="#1f2937" stroke-width="2"/><text x="870" y="588" class="h b" font-size="21">PDF check</text><text x="870" y="622" class="h b" font-size="19" style="fill:#16a34a">14 / 14 requirements</text><text x="870" y="652" class="h" font-size="16"><tspan x="870">checked against the</tspan><tspan x="870" dy="21">running system</tspan></text></svg>