<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="925" viewBox="0 0 1200 925" aria-labelledby="t d"><title id="t">Where's the repeated work?</title><desc id="d">Two rows. Without caches, every request from many users goes through nginx and the API to PostgreSQL, and each one repeats the same work: query, build the JSON page of 20 products, send it. With our caches, most requests are answered by the browser cache or by the nginx microcache, a few reach the API, and one reaches PostgreSQL. Measured: 96 % of catalogue reads answered by nginx, 18,177 requests per second on one laptop.</desc><style>.h{font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Neue','Comic Sans MS',cursive;fill:#1f2937}.m{font-family:Menlo,Consolas,monospace;fill:#1f2937}.b{font-weight:700}</style><defs><filter id="r" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="1200" height="925" fill="#fffdf8"/><path d="M34 72 Q313 67 592 70" stroke="#fde68a" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.95"/><text x="40" y="66" class="h b" font-size="42">Where's the repeated work?</text><text x="40" y="150" class="h b" font-size="25" style="fill:#dc2626">Without caches: the same work for every request</text><path d="M41.7 232.9 Q41 210.3 55 209.5 Q69 210.3 68.3 232.9 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="2" stroke-linejoin="round"/><circle cx="55" cy="197" r="8.6" fill="#a78bfa" stroke="#6d28d9" stroke-width="2"/><path d="M91.7 232.9 Q91 210.3 105 209.5 Q119 210.3 118.3 232.9 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="2" stroke-linejoin="round"/><circle cx="105" cy="197" r="8.6" fill="#a78bfa" stroke="#6d28d9" stroke-width="2"/><path d="M141.7 232.9 Q141 210.3 155 209.5 Q169 210.3 168.3 232.9 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="2" s