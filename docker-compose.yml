# Full local environment: PostgreSQL + API + Angular frontend.
#
#   docker compose up --build        -> http://localhost:8080 (UI), http://localhost:5080/swagger (API)
#   docker compose up -d db          -> database only, for running the API/UI from your IDE
#
# Credentials below are for local development only. Override them with environment variables or an .env file.
name: product-management

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: product_management
      POSTGRES_USER: ${POSTGRES_USER:-product_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-product_management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/, so the volume mounts the parent.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/ProductManagement.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ProductManagement: "Host=db;Port=5432;Database=product_management;Username=${POSTGRES_USER:-product_management};Password=${POSTGRES_PASSWORD:-product_management}"
      # Convenience for a local demo; see README "Production readiness and next steps" for how to run migrations in a real deployment.
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedSampleData: "true"
      OpenApi__Enabled: "true"
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  db-data:
